/* ---------- 찾기: 채팅으로 찾기 + 찾기 글 등록 ----------
   챗봇이 먼저 묻고, 버튼으로 답하거나 직접 써서 답해요.
   이름 · 어떤 동물 · 생김새 · 언제부터 못 봤는지 · 평소 외출 · 나간 방법은 직접 입력도 돼요 (생김새는 개수 제한 없음).
   같은 채팅으로 '닮은 기록 찾기'와 '찾기 글 등록'을 해요. 찾아도 없으면 바로 글을 등록할 수 있어요. */
let F=null;
const SINCE=[[0,'오늘부터'],[1,'어제부터'],[3,'2~3일 전부터'],[7,'일주일 넘게']];
const newFind=()=>({v:4,mode:null,step:0,stage:'chat',photos:{},name:'',species:'cat',customSpecies:'',traits:[],since:null,answers:{},say:{},lastPt:null,pick:null,running:false});
const saveF=()=>lsSet('wander2.find',{...F,R:null,running:false});
const sinceDays=t=>{t=String(t||'');if(/오늘|방금|아까/.test(t))return 0;if(/어제/.test(t))return 1;if(/그저께|엊그제/.test(t))return 2;const m=t.match(/(\d+)\s*(일|주|개월|달|시간)/);if(!m)return null;const n=+m[1];return m[2]==='일'?n:m[2]==='주'?n*7:m[2]==='시간'?0:n*30};
const speciesLabel=f=>f.customSpecies||SPECIES[f.species]||'동물';
const STEPS=[
  {k:'photos',kind:'photos',q:()=>'잃어버린 아이 사진을 올려 주세요. <b>2장 이상, 뒷모습은 꼭</b> 넣어 주세요. 길에서 찍힌 사진은 뒷모습이 많아요.'},
  {k:'name',kind:'text',ph:'이름 (예: 콩이)',q:()=>'이름이 뭐예요?'},
  {k:'species',kind:'chips',chips:[['cat','고양이'],['dog','강아지']],text:'직접 입력 (예: 토끼)',q:f=>`${h(f.name)}는 어떤 동물이에요?`},
  {k:'traits',kind:'multi',text:'직접 입력 (예: 꼬리 끝이 하얘요)',q:()=>'생김새를 알려 주세요. 여러 개 골라도 되고, 직접 써도 돼요.'},
  {k:'since',kind:'chips',chips:SINCE.map(s=>[String(s[0]),s[1]]),text:'직접 입력 (예: 3주 전부터)',q:()=>'언제부터 못 봤나요?'},
  {k:'outdoor',kind:'chips',chips:[['in','실내에서만'],['sometimes','가끔 외출'],['often','자주 외출']],text:'직접 입력 (예: 마당에서만 놀아요)',q:()=>'평소에 밖에 나간 적 있나요?'},
  {k:'last',kind:'chips',chips:[['inside','집 안'],['home','집 앞'],['map','지도에서 고르기']],q:()=>'마지막으로 본 곳은요?'},
  {k:'how',kind:'chips',chips:[['door','문이 열려서'],['window','창문 · 방충망'],['walk','산책 중'],['unknown','모르겠어요']],text:'직접 입력 (예: 택배 기사님이 문을 열었어요)',q:()=>'어떻게 나갔나요?'},
  {k:'temper',kind:'chips',chips:[['shy','숨어요'],['social','다가와요'],['unknown','잘 몰라요']],q:()=>'낯선 사람을 보면 어떤가요?'}];
function lostOf(f){
  const ph=SLOTS.map(s=>f.photos[s.k]).filter(Boolean);
  return{name:f.name||'우리 아이',photos:ph,species:f.species,coat:f.coat||'cheese',traits:f.traits,outdoor:!!(f.answers.outdoor&&f.answers.outdoor!=='in'),
    last:f.answers.last==='map'&&f.lastPt?f.lastPt:{...getHome(),label:f.answers.last==='inside'?'집 안':'집 앞'},when:f.since&&f.since[0]!=null?f.since[0]:3,how:f.answers.how,temper:f.answers.temper};
}
async function submitPost(btn){
  if(btn){btn.disabled=true;btn.textContent='등록하는 중…'}
  try{const r=await registerPost(F);F=newFind();saveF();openRegisterDone(r.p,r.n);renderFind()}
  catch(e){if(btn){btn.disabled=false;btn.textContent='찾기 글 등록하기'}toast('등록하지 못했어요. 잠시 후 다시 눌러 주세요.')}
}
function openNotFound(){
  const el=openSheet(`${topBar('아직 못 찾았어요')}<div class="sheet-body gut" style="display:flex;flex-direction:column;justify-content:center;text-align:center"><div class="done-hero"><h2>아직 못 찾았군요</h2><p>찾기 글을 등록해 두면,<br>도감에 조건이 맞는 동물이 올라올 때 알림이 가요.</p></div></div>
    <div class="foot gut"><button class="btn primary wide" id="nfReg">찾기 글 등록하기</button><div class="row2"><button class="btn light" id="nfRetry">다시 찾기</button><button class="btn light" id="nfHome">처음으로</button></div></div>`);
  wireClose(el);
  $('#nfReg').onclick=()=>submitPost($('#nfReg'));
  $('#nfRetry').onclick=()=>{closeSheet();F.stage='chat';F.step=0;F.R=null;F.pick=null;saveF();renderFind()};
  $('#nfHome').onclick=()=>{closeSheet();F=newFind();saveF();show('home')};
}
function renderFind(){
  if(!F||F.v!==4){const s=lsGet('wander2.find',null);F=s&&s.v===4?s:newFind()}
  const v=$('#v-find'),save=saveF,L=STEPS.length;
  if(!F.mode){
    const mine=Store.posts.filter(p=>p.by===Store.me).length;
    v.innerHTML=`<div class="topbar"><span class="wordmark">WANDER</span><span></span></div>
      <h1 class="title">잃어버렸나요?</h1><div class="sub">채팅으로 몇 가지만 물어볼게요</div>
      <div class="panel"><b style="font-size:17px">닮은 기록 찾기</b><p class="notice">이웃이 도감에 남긴 사진에서 닮은 아이를 찾고, 먼저 찾을 구역을 알려 드려요.</p><button class="btn primary wide" id="fgoS">찾기 시작</button></div>
      <div class="panel"><b style="font-size:17px">찾기 글 등록</b><p class="notice">글을 등록해 두면 도감에 조건이 맞는 동물이 올라올 때 알림이 가요.</p><button class="btn soft wide" id="fgoR">찾기 글 등록하기</button></div>
      <div class="list"><button class="lrow" id="fMine"><div><b>내가 등록한 글</b><span>${mine}건 · 마이페이지에서 볼 수 있어요</span></div><span>›</span></button></div>`;
    $('#fgoS').onclick=()=>{F.mode='search';save();renderFind()};
    $('#fgoR').onclick=()=>{F.mode='register';save();renderFind()};
    $('#fMine').onclick=()=>openMyPage();
    return;
  }
  if(F.stage==='result'&&!F.R){F.stage='chat';F.step=L}
  if(F.stage==='result')return renderFindResult(v,save);
  const S=F.step,reg=F.mode==='register';
  const adv=label=>{F.say[STEPS[F.step].k]=label;F.step++;save();renderFind();requestAnimationFrame(()=>{v.scrollTop=v.scrollHeight})};
  const bot=t=>`<div class="q"><span class="w">W</span><div class="bub">${t}</div></div>`;
  const me=t=>`<div class="me-row"><div class="me-b">${t}</div></div>`;
  const thumbs=()=>SLOTS.map(s=>F.photos[s.k]).filter(Boolean).map(p=>`<img src="${p.photo}" alt="${h(p.label)}">`).join('');
  const firstPhoto=SLOTS.map(s=>F.photos[s.k]).find(Boolean);
  let log='';
  for(let i=0;i<Math.min(S,L);i++){const st=STEPS[i];log+=bot(st.q(F))+me(st.k==='photos'?thumbs():h(F.say[st.k]||'-'))}
  let foot='';
  if(S<L){
    const st=STEPS[S];log+=bot(st.q(F));
    const n=Object.keys(F.photos).length,hasBack=!!F.photos.back;
    if(st.kind==='photos'){
      log+=`<div style="padding-left:38px"><div class="photo-slots">${SLOTS.map(s=>{const p=F.photos[s.k];return `<button class="pslot${s.req&&!p?' req':''}" data-slot="${s.k}">${p?`<img src="${p.photo}" alt="${s.t}">${p.badge||''}`:`<b style="font-size:20px">+</b>${s.t}${s.req?' · 필수':''}`}</button>`}).join('')}</div></div>`;
      foot=`<div class="note">${n>=2&&hasBack?'':!hasBack?'뒷모습 사진이 필요해요':'사진을 2장 이상 넣어 주세요'}</div><button class="btn primary wide" id="cbNext" ${n>=2&&hasBack?'':'disabled'}>다음</button>`;
    }else if(st.kind==='chips'){
      log+=`<div class="ansrow">${st.chips.map(([val,l])=>`<button class="chip ans" data-cv="${h(val)}">${h(l)}</button>`).join('')}</div>`;
    }else if(st.kind==='multi'){
      const tl=[...TRAITS,...F.traits.filter(t=>!TRAITS.includes(t))];
      log+=`<div class="ansrow">${tl.map(t=>`<button class="chip ans" aria-pressed="${F.traits.includes(t)}" data-tr="${h(t)}">${h(t)}</button>`).join('')}</div>`;
      foot=`<button class="btn primary wide" id="cbNext">다음</button>`;
    }
    if(st.kind==='text'||st.text)foot=`<form class="chatbar" id="cbForm"><input class="txt" id="cbIn" maxlength="40" placeholder="${h(st.kind==='text'?st.ph:st.text)}" autocomplete="off"><button class="btn primary small">${st.kind==='multi'?'추가':'보내기'}</button></form>`+foot;
  }else if(reg){
    const pv=postFromF(F),srcs=SLOTS.map(s=>F.photos[s.k]).filter(Boolean).map(p=>p.photo);
    log+=bot('다 모였어요. 이렇게 등록할게요.')+`<div style="padding-left:38px">${postBody(pv,srcs)}${postCond(pv)}</div>`;
    foot=`<button class="btn primary wide" id="rgGo">찾기 글 등록하기</button>`;
  }else{
    log+=bot('고마워요. 식별 엔진이 이웃이 찍은 사진과 비교하고 있어요… <span id="engProg"></span>');
  }
  v.innerHTML=`<div class="sheet-top" style="padding-top:10px;grid-template-columns:44px 1fr auto"><button class="icon-btn" id="fBack" aria-label="뒤로">${ICON.back}</button><b>${reg?'찾기 글 등록':(F.name?h(F.name)+' 찾기':'찾기')}</b><button class="more" id="fReset" style="padding:8px">처음부터</button></div>
    ${F.name?`<div class="profile">${firstPhoto?`<img src="${firstPhoto.photo}" alt="">`:'<span class="noimg"></span>'}<div><b>${h(F.name)}</b><span>${h([speciesLabel(F),...F.traits].slice(0,3).join(' · '))}</span></div>${F.since?`<span class="pill-pink">${h(F.since[1])} 못 봤어요</span>`:''}</div>`:''}
    <div class="msgs">${log}</div><div style="height:12px"></div>
    <div class="chatfoot">${foot}</div>`;
  $('#fBack').onclick=()=>{if(F.step>0){F.step--}else{F.mode=null}save();renderFind()};
  $('#fReset').onclick=()=>{F=newFind();save();renderFind()};
  v.querySelectorAll('[data-slot]').forEach(b=>b.onclick=()=>{const inp=document.createElement('input');inp.type='file';inp.accept='image/*';
    inp.onchange=async()=>{const f=inp.files[0];if(!f)return;try{const r=await readPhoto(f,480);const Q=await engPrep(r.photo);const qb=qualityBadges(Q).replace(/class="qq /g,'class="qb qq ');
      F.photos[b.dataset.slot]={photo:r.photo,avg:r.avg,slot:b.dataset.slot,label:SLOTS.find(s=>s.k===b.dataset.slot).t,badge:qb};
      if(Object.keys(F.photos).length===1){F.coat=guessCoat(r.avg)}
      save();renderFind()}catch(e){toast('사진을 열 수 없어요. 다른 사진을 골라 주세요.')}};inp.click()});
  v.querySelectorAll('[data-tr]').forEach(b=>b.onclick=()=>{const t=b.dataset.tr;F.traits=F.traits.includes(t)?F.traits.filter(x=>x!==t):[...F.traits,t];save();renderFind()});
  v.querySelectorAll('[data-cv]').forEach(b=>b.onclick=()=>{
    const st=STEPS[F.step],val=b.dataset.cv,label=(st.chips.find(c=>c[0]===val)||[])[1]||val;
    if(st.k==='species'){F.species=val;F.customSpecies=''}
    else if(st.k==='since'){F.since=[+val,label]}
    else F.answers[st.k]=val;
    if(st.k==='last'&&val==='map'){pickPlace(getHome(),'마지막으로 본 곳',p=>{F.lastPt={x:p.x,y:p.y,label:zoneName(p.x,p.y)};adv('지도에서 고른 곳')});return}
    adv(label)});
  const form=$('#cbForm');
  if(form)form.onsubmit=e=>{e.preventDefault();const t=$('#cbIn').value.trim();if(!t)return;const st=STEPS[F.step];
    if(st.k==='name'){F.name=t.slice(0,10);adv(F.name)}
    else if(st.k==='species'){F.species=/강아지|멍멍|^개$/.test(t)?'dog':/고양이|냥/.test(t)?'cat':'etc';F.customSpecies=F.species==='etc'?t:'';adv(t)}
    else if(st.k==='since'){F.since=[sinceDays(t),t];adv(t)}
    else if(st.k==='outdoor'){F.answers.outdoor=/실내|집안|집 안|안에서만|안에만/.test(t)?'in':'sometimes';adv(t)}
    else if(st.k==='how'){F.answers.how='custom';adv(t)}
    else if(st.k==='traits'){if(!F.traits.includes(t))F.traits.push(t);save();renderFind()}};
  const nx=$('#cbNext');
  if(nx)nx.onclick=()=>{const st=STEPS[F.step];
    if(st.k==='photos'){adv('사진 '+Object.keys(F.photos).length+'장')}
    else if(st.k==='traits'){adv(F.traits.length?F.traits.join(', '):'잘 모르겠어요')}};
  const rg=$('#rgGo');if(rg)rg.onclick=()=>submitPost(rg);
  if(S>=L&&!reg&&!F.running){F.running=true;
    analyzeEngine(lostOf(F),(i,n)=>{const e=$('#engProg');if(e)e.textContent=`${i}/${n}`}).then(R=>{F.R=R;F.running=false;F.stage='result';F.pick=null;renderFind()}).catch(()=>{F.running=false})}
}

    <div class="sec">이웃이 찍은 닮은 기록 <small>${R.cands.length}장</small></div>
    ${R.cands.length?R.cands.map((x,i)=>`<div class="cand-block"><button class="cand-row" aria-pressed="${F.pick===x.c.id}" data-pick="${h(x.c.id)}"><span class="n">${i+1}</span>${x.c.photo?`<img src="${x.c.photo}" alt="">`:'<span class="ph"></span>'}<div><b>${h(x.c.name)}</b><small>${h(x.c.zone||ZONE)} · ${whenLabel(x.c.lastSeen||x.c.createdAt)}</small></div><span class="radio">${F.pick===x.c.id?CK:''}</span></button>${x.eng?`<button class="why" data-why="${i}">엔진 점수 ${x.eng.final.toFixed(3)} · 근거 보기 ›</button><div data-whyslot="${i}"></div>`:''}</div>`).join(''):`<div class="tip">아직 닮은 기록이 없어요. 찾기 글을 등록해 두면 도감에 조건이 맞는 동물이 올라올 때 알림이 가요.<div class="mini-actions"><button class="btn soft" id="regEmpty">찾기 글 등록하기</button></div></div>`}
    <div class="sec">수색 팁</div><div class="tips">${tipsFor(L,R.r).slice(0,4).map(([a,b])=>`<div class="tip"><b>${h(a)}</b>${h(b)}</div>`).join('')}</div>
    <div style="height:20px"></div>
    <div class="foot" style="position:sticky;bottom:0"><div class="note">같은 아이인지는 보호자님이 확인해요</div><div class="row2"><button class="btn light" id="fNot">아직 못 찾았어요</button><button class="btn primary" id="fSame" ${F.pick?'':'disabled'}>이 아이 같아요</button></div></div>`;
  $('#fBack').onclick=()=>{F.stage='chat';F.step=STEPS.length-1;F.R=null;save();renderFind()};
  v.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{F.pick=F.pick===b.dataset.pick?null:b.dataset.pick;const st=v.scrollTop;renderFind();v.scrollTop=st});
  v.querySelectorAll('[data-why]').forEach(b=>b.onclick=()=>{const i=+b.dataset.why,slot=v.querySelector(`[data-whyslot="${i}"]`),x=R.cands[i];slot.innerHTML=slot.innerHTML?'':engCardHTML(x.eng,x.c.photo,R.regs,'이웃이 찍은 사진 vs 등록 사진')});
  $('#fSame').onclick=()=>confirmSame(R.cands.find(x=>x.c.id===F.pick),L);
  $('#fNot').onclick=openNotFound;
  const re=$('#regEmpty');if(re)re.onclick=()=>submitPost(re);
}
function zoneSVG(R){
  // stylised street grid like the film: dashed search circle, home in a dashed square, pink rectangles where look-alikes were seen
  const W=380,H=200,cx=W*.4,cy=H*.5,sc=R.r>=1000?.06:.6;
  let s=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="${W}" height="${H}" fill="#EEF0F8"/>`;
  for(let x=-10;x<W;x+=46)for(let y=-12;y<H;y+=40)s+=`<rect x="${x+6}" y="${y+6}" width="36" height="30" rx="5" fill="#E1E4F2"/>`;
  s+=`<path d="M0 ${H*.72}L${W} ${H*.6}" stroke="#fff" stroke-width="10"/><path d="M${W*.62} 0L${W*.7} ${H}" stroke="#fff" stroke-width="10"/>`;
  s+=`<ellipse cx="${cx}" cy="${cy}" rx="${Math.min(W*.42,150)}" ry="${H*.62}" fill="rgba(101,115,227,.07)" stroke="#6573E3" stroke-width="1.6" stroke-dasharray="6 5"/>`;
  R.cands.slice(0,3).forEach(x=>{const px=cx+(x.c.x-R.home.x)*sc,py=cy+(x.c.y-R.home.y)*sc*.6;const X=Math.max(10,Math.min(W-62,px-26)),Y=Math.max(8,Math.min(H-40,py-16));s+=`<rect x="${X}" y="${Y}" width="52" height="32" rx="7" fill="rgba(240,96,126,.18)" stroke="#F0607E" stroke-width="1.8"/>`});
  s+=`<rect x="${cx-34}" y="${cy-22}" width="68" height="44" rx="8" fill="rgba(101,115,227,.14)" stroke="#6573E3" stroke-width="1.6" stroke-dasharray="4 3"/><rect x="${cx-12}" y="${cy-11}" width="24" height="22" rx="6" fill="#3D4AB5"/><path d="M${cx-6} ${cy+4}v-4l6-5 6 5v4z" fill="#fff"/></svg>`;
  return s;
}
async function confirmSame(x,L){
  if(!x)return;
  const c=x.c;
  try{await requestExact(x,L)}catch(e){}
  try{await Store.addAlert({id:uid(),type:'clue',to:c.by||null,cardId:c.id,cardName:c.name,cardNo:c.no,lostName:L.name,at:Date.now()})}catch(e){}
  const el=openSheet(`${topBar(L.name+' 찾기')}<div class="sheet-body gut" style="display:flex;flex-direction:column;justify-content:center;text-align:center">
    <div class="done-hero"><h2>찍은 이웃에게 알렸어요</h2><p>정확한 위치는 이웃이 승인하면 72시간 동안 열려요.<br>찾으면 이웃에게 고맙다고 전해 주세요.</p></div>
    <div style="max-width:260px;margin:18px auto 0">${bigCard(c)}</div>
  </div><div class="foot gut"><div class="row2"><button class="btn light" id="fLater">나중에</button><button class="btn primary" id="fFound">${h(L.name)}를 찾았어요</button></div></div>`);
  wireClose(el);

  $('#fFound').onclick=async()=>{
    // the owner found the pet: the card becomes a clue card for the person who took it
    try{await Store.update(c.id,{helped:(c.helped||0)+1,seen:(c.seen||1)+1,realName:L.name});
      await Store.addAlert({id:uid(),type:'thanks',to:c.by||null,cardId:c.id,cardName:c.name,cardNo:c.no,lostName:L.name,msg:'덕분에 집에 데려왔어요. 고마워요!',at:Date.now()})}catch(e){}
    closeSheet();F=newFind();lsSet('wander2.find',F);show('home');
    // the film shows the photographer's side next; on one demo phone both sides are the same person
    if(!c.by||c.by===Store.me)setTimeout(()=>pushClue(c.id,L.name),900);
  };
}

/* ---------- real neighbourhood name ----------
   GPS -> OpenStreetMap reverse geocoding (Nominatim) -> 동 이름. Cached; asked again only after moving ~300m or a day later.
   Coordinates are rounded to ~100m before they leave the phone. Without GPS the last known name (or 궁동) stays. */
function setNB(n){
  if(!n)return;NB=n;ZONE=n+' 일대';relocateSamples();
  $('#camZone').innerHTML='<i></i>'+h(ZONE);
  renderHome();renderDex();
}
async function locateHood(){
  if(!navigator.geolocation||!window.isSecureContext)return;
  const pos=await new Promise(res=>{const to=setTimeout(()=>res(null),9000);try{navigator.geolocation.getCurrentPosition(p=>{clearTimeout(to);res(p.coords)},()=>{clearTimeout(to);res(null)},{enableHighAccuracy:false,timeout:8000,maximumAge:300000})}catch(e){clearTimeout(to);res(null)}});
  if(!pos)return;
  lsSet('wander2.home',ll2xy(pos.latitude,pos.longitude));relocateSamples();
  const c=lsGet('wander2.hood',null);
  const moved=c?Math.hypot((pos.longitude-c.lng)*111320*Math.cos(pos.latitude*Math.PI/180),(pos.latitude-c.lat)*110540):1e9;
  if(c&&c.name&&moved<300&&Date.now()-c.at<DAY){setNB(c.name);return}
  try{
    const lat=pos.latitude.toFixed(3),lon=pos.longitude.toFixed(3);
    const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}&zoom=16&accept-language=ko`);
    const a=((await r.json())||{}).address||{};
    let n=a.quarter||a.suburb||a.neighbourhood||a.village||a.town||a.city_district||a.borough||a.city;
    if(n){n=String(n).replace(/\(.*\)/,'').trim().split(' ').pop();lsSet('wander2.hood',{name:n,lat:pos.latitude,lng:pos.longitude,at:Date.now()});setNB(n)}
  }catch(e){}
}
