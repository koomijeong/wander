<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#F2F3FB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WANDER">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>WANDER</title>
<script>window.APP_V="1794829136";</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>
<style>
/* WANDER app v4 — design follows the WANDER_app_v3 film:
   light lavender ground, white rounded cards, periwinkle actions, deep indigo banner,
   rarity frames (일반 회색 · 레어 블루 ◆ · 스페셜 골드 ★ · 단서 홀로그램 ✦).
   Deliberately single-theme (light), like the film; the camera is always dark. */
:root{
  --bg:#F2F3FB; --bg2:#E9EBFA; --surface:#FFFFFF; --ink:#1D2140; --ink2:#3A3F63; --muted:#8A8FAD; --line:#E5E7F3;
  --accent:#6573E3; --accent-ink:#FFFFFF; --accent-soft:#E9EBFC; --accent-text:#5262D9; --deep:#3D4AB5;
  --pink:#E2457A; --pink-soft:#FDE8EF;
  --r-normal:#A6AABF; --r-rare:#6D7BE6; --r-special:#E8A43A; --r-clue:#C77DF0;
  --ok-bg:#E2F6EA; --ok-ink:#1E6B3D; --warn-bg:#FFF1DA; --warn-ink:#80510A;
  --shadow:0 8px 24px rgba(61,74,181,.10); --shadow-lg:0 18px 40px rgba(61,74,181,.18);
  --font-ui:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;
  --font-brand:"Outfit",-apple-system,"Apple SD Gothic Neo",sans-serif;
  --coral:#F0607E; --on-coral:#FFFFFF; --indigo:#6573E3; --map-ground:#EEF0F8;
  color-scheme:light;
}
html{box-sizing:border-box;height:100%;background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:15px;-webkit-tap-highlight-color:transparent;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
img{max-width:100%}
.gut{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}

/* app frame */
.app{height:100%;display:flex;flex-direction:column;max-width:520px;margin:0 auto;background:var(--bg);position:relative}
@media (min-width:600px){.app{box-shadow:0 0 0 1px var(--line)}}
.view{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:16px}
.wordmark{font-family:var(--font-brand);font-weight:700;letter-spacing:.16em;font-size:13px;color:var(--ink)}
.eyebrow{font-size:13px;color:var(--muted);text-align:center;font-weight:600}
h1.title{margin:6px 0 0;font-size:26px;line-height:1.3;font-weight:800;letter-spacing:-.03em;text-wrap:balance}
h1.title em,.hl{font-style:normal;color:var(--accent-text)}
.sub{color:var(--muted);font-size:14px;margin-top:6px}
.topbar{display:flex;justify-content:space-between;align-items:center;padding-block:14px 4px}
.icon-btn{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;position:relative;color:var(--ink)}
.icon-btn svg{width:24px;height:24px}
.dot-badge{position:absolute;top:6px;right:6px;min-width:16px;height:16px;border-radius:8px;background:var(--pink);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 4px}
.panel{background:var(--surface);border-radius:24px;padding:16px;box-shadow:var(--shadow);margin-top:14px}
.panel-head{display:flex;justify-content:space-between;align-items:center}
.panel-head b{font-size:17px;font-weight:800;letter-spacing:-.02em}
.more{font-size:13px;color:var(--muted);font-weight:600}
.progress{height:8px;border-radius:4px;background:var(--bg2);overflow:hidden;margin-top:12px}
.progress i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .5s}

/* tab bar with raised camera button */
.tabs{display:grid;grid-template-columns:repeat(5,1fr);align-items:end;background:var(--surface);border-top:1px solid var(--line);padding-block:6px 6px;padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px));position:relative;z-index:5}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;font-size:11px;font-weight:700;color:#B5B8CC}
.tab svg{width:24px;height:24px}
.tab[aria-selected="true"]{color:var(--ink)}
.fab{justify-self:center;width:62px;height:62px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 10px 24px rgba(101,115,227,.45);margin-top:-30px;border:5px solid var(--bg)}
.fab svg{width:26px;height:26px}

/* chips */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border-radius:999px;padding:8px 14px;font-size:13px;font-weight:700;background:var(--surface);color:var(--ink2);border:1px solid var(--line)}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.ans{color:var(--ink2)}
.chip.ans[aria-pressed="true"]{background:var(--deep);border-color:var(--deep);color:#fff}
.tag{display:inline-flex;align-items:center;border-radius:8px;padding:3px 8px;font-size:12px;font-weight:700;background:var(--accent-soft);color:var(--deep)}
.pill-pink{display:inline-flex;border-radius:8px;padding:4px 9px;font-size:12px;font-weight:800;background:var(--pink-soft);color:var(--pink)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:16px;padding:15px 20px;font-weight:800;font-size:16px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:disabled{opacity:.45}
.btn.light{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.btn.soft{background:var(--accent-soft);color:var(--deep)}
.btn.ink{background:var(--ink);color:#fff}
.btn.small{padding:9px 14px;font-size:13px;border-radius:12px}
.btn.wide{width:100%}
.foot{padding-block:10px 14px;display:flex;flex-direction:column;gap:8px;background:linear-gradient(to bottom,rgba(242,243,251,0),var(--bg) 30%)}
.foot .note{text-align:center;font-size:12px;color:var(--muted)}
.foot .row2{display:flex;gap:10px}.foot .row2 .btn{flex:1}

/* rarity */
.r-normal{--rc:var(--r-normal)}.r-rare{--rc:var(--r-rare)}.r-special{--rc:var(--r-special)}.r-clue{--rc:var(--r-clue)}
.rglyph{color:var(--rc);font-size:10px;margin-right:4px}

/* dex mini card (grid) */
.dex-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
.mcard{position:relative;background:var(--surface);border-radius:18px;padding:6px 6px 8px;text-align:left;border:1.5px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0;transition:transform .15s}
.mcard:active{transform:perspective(500px) rotateX(5deg) rotateY(-5deg) scale(.98)}
.mcard.r-rare{border-color:var(--r-rare)}
.mcard.r-special{border-color:var(--r-special);box-shadow:0 0 0 2px rgba(232,164,58,.18)}
.mcard.r-clue{border:2px solid transparent;background:linear-gradient(var(--surface),var(--surface)) padding-box,linear-gradient(135deg,#8FD3FF,#C77DF0,#FF9EC4,#FFD27A,#8FE3B5) border-box}
.mcard .ph{aspect-ratio:1;border-radius:13px;overflow:hidden;background:var(--bg2);display:grid;place-items:center;max-width:100%}
.mcard .ph img{width:100%;height:100%;object-fit:cover;display:block}
.mcard .ph svg{width:80%;height:80%}
.mcard b{font-size:13px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;padding:0 2px}
.mcard small{font-size:11px;color:var(--muted);padding:0 2px}
.new-badge{position:absolute;top:10px;left:10px;background:var(--accent);color:#fff;font:800 9px var(--font-brand);letter-spacing:.06em;border-radius:6px;padding:2px 6px;z-index:1}
.slot-empty{aspect-ratio:.78;border-radius:18px;border:1.5px dashed #D3D6EA;display:grid;place-items:center;color:#C3C6DA;font:800 20px var(--font-brand)}

/* home */
.dex-strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:14px}
.dex-strip .t{aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--bg2);display:grid;place-items:center;color:var(--muted);font-weight:800}
.dex-strip .t img{width:100%;height:100%;object-fit:cover}
.dex-strip .t.q{border:1.5px dashed #CDD0E6;background:var(--surface)}
.recent{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.banner{position:relative;overflow:hidden;background:var(--deep);color:#fff;border-radius:24px;padding:20px;margin-top:14px;min-height:150px}
.banner b{display:block;font-size:20px;line-height:1.35;font-weight:800;letter-spacing:-.02em;max-width:62%}
.banner p{margin:8px 0 14px;font-size:13px;opacity:.85;max-width:60%}
.banner .go{background:#fff;color:var(--deep);border-radius:12px;padding:10px 14px;font-weight:800;font-size:14px}
.banner img{position:absolute;right:14px;bottom:14px;width:30%;max-width:120px;border-radius:16px;transform:rotate(-6deg);border:3px solid #fff;box-shadow:0 8px 18px rgba(0,0,0,.25)}
.list{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);margin-top:14px;overflow:hidden}
.lrow{display:flex;align-items:center;gap:12px;padding:14px 16px;width:100%;text-align:left}
.lrow+.lrow{border-top:1px solid var(--line)}
.lrow .ic{width:36px;height:36px;border-radius:12px;background:var(--accent-soft);color:var(--deep);display:grid;place-items:center;flex:none}
.lrow .ic svg{width:20px;height:20px}
.lrow div{flex:1;min-width:0}.lrow b{display:block;font-size:15px}.lrow span{font-size:12px;color:var(--muted)}

/* full WANDER card (video style) */
.wcard{background:var(--surface);border-radius:22px;overflow:hidden;box-shadow:var(--shadow-lg);border:2px solid var(--line);transform-style:preserve-3d;transition:transform .25s ease;will-change:transform;position:relative}
.wcard.r-rare{border-color:var(--r-rare)}
.wcard.r-special{border-color:var(--r-special)}
.wcard.r-clue{border:3px solid transparent;background:linear-gradient(var(--surface),var(--surface)) padding-box,linear-gradient(135deg,#8FD3FF,#C77DF0,#FF9EC4,#FFD27A,#8FE3B5) border-box}
.wcard .hd{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px}
.wcard .hd b{font-size:18px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:6px;min-width:0}
.wcard .hd b span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wcard.r-clue .hd b,.wcard.r-clue .lv b{background:linear-gradient(90deg,#7A6BF0,#C77DF0);-webkit-background-clip:text;background-clip:text;color:transparent}
.lv{font:600 12px var(--font-brand);color:var(--muted);white-space:nowrap}.lv b{font-size:22px;color:var(--ink);margin-left:2px}
.wcard.r-special .lv b{color:var(--r-special)}
.wcard .pic{margin:0 12px;aspect-ratio:1.18;border-radius:16px;overflow:hidden;position:relative;background-color:#F4F5FB;background-image:radial-gradient(#D7DAEC 1.2px,transparent 1.3px);background-size:14px 14px;max-width:100%}
.wcard.r-rare .pic{background-color:#EEF0FD;background-image:linear-gradient(45deg,#E2E6FB 25%,transparent 25%,transparent 75%,#E2E6FB 75%),linear-gradient(45deg,#E2E6FB 25%,transparent 25%,transparent 75%,#E2E6FB 75%);background-size:18px 18px;background-position:0 0,9px 9px}
.wcard.r-special .pic{background:repeating-conic-gradient(from 0deg at 50% 60%,#FFE9B8 0deg 10deg,#FFD884 10deg 20deg)}
.wcard.r-clue .pic{background:linear-gradient(135deg,#FFD9EC,#FFF2C7 30%,#D8F6E6 55%,#D6E6FF 78%,#EBD9FF)}
.wcard .pic img{width:100%;height:100%;object-fit:cover;display:block}
.wcard .pic svg{width:70%;height:70%;margin:auto;display:block;position:absolute;inset:0}
.wcard .pic .clue-badge{position:absolute;right:10px;bottom:10px;background:linear-gradient(90deg,#FF7EB6,#B57CF7);color:#fff;font-size:12px;font-weight:800;border-radius:10px;padding:5px 10px}
.wcard .meta{padding:12px 16px 4px;display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:13px;align-items:center}
.wcard .meta span{color:var(--muted);font-size:12px}
.wcard .meta b{font-weight:700;display:flex;gap:6px;flex-wrap:wrap;align-items:center;min-width:0}
.wcard .ft{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;margin-top:8px;background:#F6F7FC;font-size:12px;font-weight:700;color:var(--ink2)}
.wcard .ft small{font:700 9px var(--font-brand);letter-spacing:.12em;color:var(--muted)}
.wcard .shine{position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(circle at var(--gx,50%) var(--gy,0%),rgba(255,255,255,.55),transparent 55%);opacity:0;transition:opacity .2s;z-index:2}
.tilting .shine{opacity:1}
.zone-ic{width:12px;height:12px;border:1.5px dashed var(--muted);border-radius:3px;display:inline-block}

/* sheets */
.sheet{position:fixed;inset:0;max-width:520px;margin:0 auto;z-index:30;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);animation:up .28s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.sheet-top{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding-block:8px}
.sheet-top b{text-align:center;font-size:17px;font-weight:800}
.sheet-body{flex:1;min-height:0;overflow-y:auto;padding-block:4px 20px}
.field{margin-top:18px}
.field>.lab,.field>label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:0 2px 8px}
.txt{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:13px 14px;font-size:16px}
.notice{font-size:12px;color:var(--muted);line-height:1.55;padding:8px 2px}
.empty{text-align:center;padding:36px 16px;color:var(--muted);line-height:1.6}
.empty strong{display:block;color:var(--ink);font-size:17px;margin-bottom:6px}
.sec{font-size:17px;font-weight:800;margin:22px 2px 10px;letter-spacing:-.02em}
.sec small{font-size:13px;color:var(--muted);font-weight:600;margin-left:4px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;background:var(--ink);color:#fff;border-radius:16px;padding:12px 16px;font-size:14px;font-weight:700;max-width:calc(100% - 32px);box-shadow:var(--shadow-lg);animation:up .25s}
.push{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translateX(-50%);width:min(500px,calc(100% - 20px));z-index:90;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:20px;padding:12px 14px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow-lg);text-align:left;animation:drop .4s cubic-bezier(.2,.9,.2,1.1)}
@keyframes drop{from{transform:translate(-50%,-120%)}to{transform:translate(-50%,0)}}
.push .app-ic{width:40px;height:40px;border-radius:11px;background:var(--ink);color:#fff;font:700 6px var(--font-brand);letter-spacing:.08em;display:grid;place-items:center;flex:none}
.push div{flex:1;min-width:0}.push small{font:700 11px var(--font-brand);letter-spacing:.08em;color:var(--muted)}.push p{margin:2px 0 0;font-weight:700;font-size:14px;line-height:1.4}
.push time{font-size:11px;color:var(--muted);align-self:flex-start}

/* camera / AR */
.cam{position:fixed;inset:0;z-index:40;background:#0E0F18;color:#fff;overflow:hidden}
.cam video,.cam .cam-still{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam .cam-still{background:radial-gradient(120% 80% at 50% 30%,#3B3F63,#14152A)}
.cam .shade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.35),transparent 18%,transparent 70%,rgba(0,0,0,.45));pointer-events:none}
.cam-top{position:absolute;left:0;right:0;top:0;padding-top:calc(12px + env(safe-area-inset-top,0px));display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px;z-index:3}
.glass{background:rgba(30,32,52,.38);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.18)}
.cam-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff}
.cam-btn svg{width:22px;height:22px}
.cam-btn[aria-pressed="true"]{background:#FFD45C;color:#1D2140}
.zone-pill{justify-self:center;display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:9px 14px;font-size:14px;font-weight:700;color:#fff}
.zone-pill i{width:12px;height:12px;border-radius:50%;border:2px solid rgba(255,255,255,.75)}
.ar{position:absolute;inset:0;z-index:2;pointer-events:none}
.ar-box{position:absolute;border:3px solid rgba(255,255,255,.95);border-radius:22px;box-shadow:0 0 0 1px rgba(0,0,0,.08),0 0 30px rgba(255,255,255,.18);transition:left .18s linear,top .18s linear,width .18s linear,height .18s linear,opacity .25s}
.ar-box.guide{border-style:dashed;border-color:rgba(255,255,255,.6);box-shadow:none}
.ar-label{position:absolute;display:inline-flex;align-items:center;gap:8px;background:#fff;color:var(--ink);border-radius:999px;padding:8px 14px 8px 8px;font-size:14px;font-weight:800;box-shadow:0 6px 18px rgba(0,0,0,.2);transition:left .18s linear,top .18s linear,opacity .25s;white-space:nowrap;pointer-events:auto}
.ar-label .ck{width:22px;height:22px;border-radius:50%;background:var(--accent);display:grid;place-items:center;color:#fff}
.ar-label .ck svg{width:13px;height:13px}
.ar-label small{font-weight:700;color:var(--muted);font-size:12px}
.ar-hint{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);text-align:center;font-weight:700;font-size:15px;text-shadow:0 1px 6px rgba(0,0,0,.6);width:80%}
.ar-hint small{display:block;font-weight:500;font-size:13px;opacity:.85;margin-top:6px}
.cam-bottom{position:absolute;left:0;right:0;bottom:0;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:3;padding-left:16px;padding-right:16px}
.cam-bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;border-radius:30px;padding:12px 18px;max-width:440px;margin:0 auto}
.cam-side{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:700;color:#fff;position:relative}
.cam-side .sq{width:50px;height:50px;border-radius:14px;background:#fff;overflow:hidden;display:grid;place-items:center;color:var(--deep)}
.cam-side .sq img{width:100%;height:100%;object-fit:cover}
.cam-side .sq svg{width:26px;height:26px}
.cam-side .cnt{position:absolute;top:-6px;right:calc(50% - 32px);background:var(--accent);color:#fff;font-size:10px;font-weight:800;border-radius:9px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px;border:2px solid #fff}
.shutter{width:78px;height:78px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(from 200deg,#B7A3F5,#8D9BFF,#D7A4E8,#B7A3F5);padding:5px;transition:transform .12s}
.shutter span{width:100%;height:100%;border-radius:50%;background:#fff;border:3px solid rgba(29,33,64,.12)}
.shutter:active{transform:scale(.92)}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:4;transition:opacity .3s}
.flash.on{opacity:.9;transition:none}
.cam-msg{position:absolute;left:16px;right:16px;bottom:calc(140px + env(safe-area-inset-bottom,0px));text-align:center;font-size:12px;opacity:.8;z-index:3}
.cam-msg button{color:#fff;text-decoration:underline;font-weight:700}

/* reveal */
.reveal-wrap{perspective:1200px;margin:6px auto 0;max-width:330px}
.reveal-wrap .wcard{animation:flipin .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes flipin{0%{transform:rotateY(-100deg) scale(.7);opacity:0}60%{transform:rotateY(12deg) scale(1.02);opacity:1}100%{transform:none}}

<script>
"use strict";
/* ---------- data ---------- */

let NB=(()=>{try{const v=JSON.parse(localStorage.getItem('wander2.hood')||'null');return(v&&v.name)||NB_DEFAULT}catch(e){return NB_DEFAULT}})();
let ZONE=NB?NB+' 일대':'현재 위치';
const COATS={

  mackerel:{label:'고등어',bg:'#E4E8F2',ink:'#263147',fur:'#9AA0AD',fur2:'#565B69',names:['담장 위 고등어','줄무늬','회색이'],traits:['고등어 무늬']},
  calico:{label:'삼색',bg:'#FBE4EC',ink:'#5E2140',fur:'#FBF7F0',fur2:'#E68A3E',fur3:'#2E2A2A',names:['삼색 공주','꽃님이','알록이'],traits:['삼색 무늬']},
  tuxedo:{label:'턱시도',bg:'#E3E5FA',ink:'#1F2350',fur:'#2C2B35',fur2:'#FBFAF6',names:['턱시도 신사','양말이'],traits:['턱시도']},
  white:{label:'흰색',bg:'#EAF2E6',ink:'#26391F',fur:'#FAF8F3',fur2:'#E6DED0',names:['눈송이','구름이'],traits:['흰 털']},
  black:{label:'검정',bg:'#E8E4F4',ink:'#251E40',fur:'#2A2733',fur2:'#3D3948',names:['까망이','밤톨이'],traits:['올블랙']},
  brown:{label:'갈색',bg:'#F5EAD6',ink:'#4A3214',fur:'#B07A45',fur2:'#8A5A2E',names:['초코','누룽지'],traits:['갈색 털']}
};

const LANDMARKS=[
  {n:'편의점 앞',x:60,y:-40},{n:'놀이터',x:-170,y:-160},{n:'화분 골목',x:-220,y:170},{n:'담장길',x:230,y:120},
  {n:'주차장',x:190,y:-230},{n:'화단 옆',x:-30,y:270},{n:'학교 담장',x:340,y:-70},{n:'개울가',x:-340,y:-20}
];
const HOUR=3600e3,DAY=24*HOUR;
const T0=Date.now();
const cat=k=>'assets/cats/'+k+'.jpg';
const SAMPLES=[
  {id:'s1',breed:'아메리칸 숏헤어',no:12,name:'담장 위 고등어',species:'cat',coat:'mackerel',traits:['고등어 무늬','초록 눈','흰 양말'],photo:cat('godeungeo'),x:235,y:115,seen:1,createdAt:T0-3*HOUR,lastSeen:T0-3*HOUR,sample:true,zone:'궁동 일대'},
  {id:'s2',breed:'코리안 숏헤어',no:7,name:'화분 옆 치즈',species:'cat',coat:'cheese',traits:['치즈 무늬','흰 가슴','줄무늬 꼬리'],photo:cat('cheese'),x:-210,y:160,seen:5,createdAt:T0-19*DAY,lastSeen:T0-8*HOUR,sample:true,zone:'궁동 일대'},
  {id:'s3',breed:'브리티시 숏헤어',no:9,name:'회색 대장',species:'cat',coat:'mackerel',traits:['회색','흰 가슴','흰 양말'],photo:cat('hoesaek'),x:70,y:-30,seen:4,createdAt:T0-13*DAY,lastSeen:T0-26*HOUR,sample:true,zone:'궁동 일대'},
  {id:'s4',breed:'봄베이',no:11,name:'까망이',species:'cat',coat:'black',traits:['올블랙'],photo:cat('kkamangi'),x:195,y:-225,seen:2,createdAt:T0-7*DAY,lastSeen:T0-2*DAY,sample:true,zone:'궁동 일대'},
  {id:'s5',breed:'재패니즈 밥테일',no:5,name:'삼색 공주',species:'cat',coat:'calico',traits:['삼색 무늬','줄무늬 꼬리'],photo:cat('samsaek'),x:-165,y:-150,seen:3,createdAt:T0-15*DAY,lastSeen:T0-3*DAY,sample:true,zone:'궁동 일대'},
  {id:'s6',breed:'터키시 반',no:4,name:'턱시도 신사',species:'cat',coat:'tuxedo',traits:['턱시도','흰 양말'],photo:cat('tuxedo'),x:330,y:-60,seen:2,createdAt:T0-16*DAY,lastSeen:T0-4*DAY,sample:true,zone:'궁동 일대'},
  {id:'s7',breed:'노르웨이 숲',no:3,name:'솜털이',species:'cat',coat:'white',traits:['장모','털복숭이','초록 눈'],photo:cat('nunsong'),x:-30,y:265,seen:3,createdAt:T0-18*DAY,lastSeen:T0-5*DAY,sample:true,zone:'궁동 일대'},
  {id:'s8',breed:'터키시 반',no:8,name:'밥때 손님',species:'cat',coat:'tuxedo',traits:['흰 털','검은 얼룩'],photo:cat('eunbit'),x:-335,y:-25,seen:1,createdAt:T0-9*DAY,lastSeen:T0-9*DAY,sample:true,zone:'궁동 일대'},
  {id:'s9',breed:'재패니즈 밥테일',no:10,name:'카오스',species:'cat',coat:'calico',traits:['삼색 무늬','긴 꼬리'],photo:cat('chaos'),x:180,y:-210,seen:2,createdAt:T0-10*DAY,lastSeen:T0-6*DAY,sample:true,zone:'궁동 일대'}
];
const isNew=c=>Date.now()-(c.createdAt||0)<DAY;

/* 종(품종): 카드에는 별명 아래에 실제 종을 보여요. 도감 위에는 모은 마릿수와 종 수만 보여요. */
const BREEDS={
  cat:['코리안 숏헤어','브리티시 숏헤어','아메리칸 숏헤어','러시안 블루','터키시 앙고라','터키시 반','스코티시 폴드','페르시안','샴','노르웨이 숲','벵갈','먼치킨','봄베이','재패니즈 밥테일','아비시니안','믹스'],
  dog:['말티즈','푸들','포메라니안','진돗개','시츄','믹스견'],
  bird:['비둘기','참새','까치','기타 새'],
  etc:['기타']};
/* 털 색깔로 고른 그럴듯한 종 이름 (카드를 만들 때 자동으로 채우고, 바꿀 수 있어요) */
const BREED_BY_COAT={cheese:'코리안 숏헤어',mackerel:'아메리칸 숏헤어',calico:'재패니즈 밥테일',tuxedo:'터키시 반',white:'터키시 앙고라',black:'봄베이',brown:'아비시니안'};
const breedOf=c=>c.breed||(c.species==='cat'?BREED_BY_COAT[c.coat]:null)||'종 모름';
const speciesCount=cards=>new Set(cards.map(breedOf).filter(b=>b!=='종 모름')).size;

/* 공통 좌표: 모든 폰이 같은 기준점(REF, 궁동)에서 잰 미터(x=동쪽, y=남쪽)를 써요.
   그래서 같은 장소는 어느 폰에서 찍어도 같은 150m 칸에 들어가요. (REF에서 멀수록 칸이 몇 % 어긋날 수 있어요) */
const REF={lat:36.3615,lng:127.3466};
const ll2xy=(lat,lng)=>({x:(lng-REF.lng)*111320*Math.cos(REF.lat*Math.PI/180),y:-(lat-REF.lat)*110540});
const xy2ll=(x,y)=>({lat:REF.lat-y/110540,lng:REF.lng+x/(111320*Math.cos(REF.lat*Math.PI/180))});
const REAL=!(window.claude&&window.claude.use);   // 웹 버전이면 실제 지도, Claude 링크 안이면 그림 지도
const getHome=()=>{try{return JSON.parse(localStorage.getItem('wander2.home')||'null')||{x:0,y:0}}catch(e){return{x:0,y:0}}};

/* 알림 예시 (처음 열었을 때 비어 보이지 않게). 레벨 · 훈장 계산에는 세지 않아요. */
const SAMPLE_ALERTS=[
  {id:'a2',type:'thanks',to:null,cardId:'s2',cardName:'화분 옆 치즈',cardNo:7,lostName:'콩이',msg:'덕분에 집에 데려왔어요. 고마워요!',sample:true,at:T0-25*60e3},
  {id:'a1',type:'clue',to:null,cardId:'s2',cardName:'화분 옆 치즈',cardNo:7,lostName:'콩이',sample:true,at:T0-40*60e3},
  {id:'a3',type:'clue',to:null,cardId:'s4',cardName:'까망이',cardNo:11,lostName:'밤이',sample:true,at:T0-3*HOUR}];
const SAMPLE_REQUESTS=[
  {id:'r1',cardId:'s3',cardNo:9,cardName:'회색 대장',lostName:'보리',from:'sample',to:null,status:'pending',score:0.83,sample:true,at:T0-10*60e3}];

/* 예시 카드는 '내 위치 기준 거리'로 기억해 둬요. 앱을 열 때 GPS를 읽으면 항상 지금 있는 곳 주변으로 옮겨져요. */
SAMPLES.forEach(c=>{c.ox=c.x;c.oy=c.y;c.lsAgo=T0-c.lastSeen;c.caAgo=T0-c.createdAt});

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const h=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad2=n=>String(n).padStart(2,'0');
const ago=t=>{const d=Date.now()-t;if(d<60e3)return'방금';if(d<HOUR)return Math.floor(d/60e3)+'분 전';if(d<DAY)return Math.floor(d/HOUR)+'시간 전';return Math.floor(d/DAY)+'일 전'};
const fmtDate=t=>{const d=new Date(t);return `${d.getMonth()+1}월 ${d.getDate()}일`};
const fmtDT=t=>{const d=new Date(t),hh=d.getHours();return `${d.getMonth()+1}월 ${d.getDate()}일 ${hh<12?'오전':'오후'} ${hh%12||12}:${String(d.getMinutes()).padStart(2,'0')}`};
const whenLabel=t=>{const d=new Date(t),n=new Date(),hh=d.getHours(),tm=`${hh<12?'오전':'오후'} ${hh%12||12}:${String(d.getMinutes()).padStart(2,'0')}`;const day=Math.round((new Date(n.toDateString())-new Date(d.toDateString()))/DAY);return day===0?'오늘 '+tm:day===1?'어제 '+tm:`${d.getMonth()+1}월 ${d.getDate()}일`};
const CELL=150;const snap=v=>Math.floor(v/CELL)*CELL+CELL/2;
const nearest=(x,y)=>LANDMARKS.reduce((a,l)=>{const d=Math.hypot(l.x-x,l.y-y);return d<a.d?{l,d}:a},{l:LANDMARKS[0],d:1e9}).l;
const zoneName=(x,y)=>REAL?ZONE:nearest(x,y).n+' 구역';
const lsGet=(k,f)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):f}catch(e){return f}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function toast(msg){const r=$('#toastRoot');r.innerHTML=`<div class="toast" role="status">${h(msg)}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>r.innerHTML='',2600)}
const ICON={
  close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',

  pin:'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>'
};

/* ---------- illustrations ---------- */
function art(coat,species){
  const c=COATS[coat]||COATS.cheese, f=c.fur, f2=c.fur2, f3=c.fur3||f2;
  const eye=coat==='black'?'#F2C94C':'#2C2B35', eyeOn=coat==='black'||coat==='tuxedo';
  if(species==='dog'){
    return `<svg viewBox="0 0 200 200" aria-hidden="true"><ellipse cx="52" cy="98" rx="22" ry="44" fill="${f2}" transform="rotate(18 52 98)"/><ellipse cx="148" cy="98" rx="22" ry="44" fill="${f2}" transform="rotate(-18 148 98)"/><ellipse cx="100" cy="108" rx="58" ry="60" fill="${f}"/><ellipse cx="100" cy="138" rx="32" ry="24" fill="#FBF3E6"/><ellipse cx="100" cy="124" rx="11" ry="8" fill="#2C2B35"/><path d="M100 132v10M88 146q12 8 24 0" stroke="#2C2B35" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="78" cy="96" r="7" fill="#2C2B35"/><circle cx="122" cy="96" r="7" fill="#2C2B35"/><circle cx="80" cy="94" r="2" fill="#fff"/><circle cx="124" cy="94" r="2" fill="#fff"/></svg>`;
  }
  if(species==='bird'){
    return `<svg viewBox="0 0 200 200" aria-hidden="true"><ellipse cx="100" cy="112" rx="60" ry="56" fill="${f}"/><ellipse cx="118" cy="132" rx="34" ry="26" fill="${f2}"/><path d="M48 104l-24 8 24 8z" fill="#F2B544"/><circle cx="74" cy="94" r="7" fill="#2C2B35"/></svg>`;
  }
  let marks='';
  if(coat==='cheese'||coat==='mackerel'||coat==='brown') marks=`<path d="M100 66v18M84 70l4 14M116 70l-4 14" stroke="${f2}" stroke-width="7" stroke-linecap="round"/><path d="M40 118h18M42 132h16M142 118h18M142 132h16" stroke="${f2}" stroke-width="6" stroke-linecap="round"/>`;
  if(coat==='calico') marks=`<path d="M48 90c10-30 40-36 48-30-4 22-24 36-48 30z" fill="${f2}"/><path d="M152 92c-8-26-34-34-44-28 4 20 22 34 44 28z" fill="${f3}"/>`;
  if(coat==='tuxedo') marks=`<path d="M100 92c-26 0-36 26-36 44 10 20 62 20 72 0 0-18-10-44-36-44z" fill="${f2}"/>`;
  if(coat==='white') marks=`<ellipse cx="128" cy="86" rx="16" ry="12" fill="${f2}"/>`;

function baseLayer(){
  if(BASE)return BASE;
  let s='',seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
  const G=160;
  for(let i=-16;i<16;i++)for(let j=-16;j<16;j++){
    const cx=i*G+G/2,cy=j*G+G/2;
    if(Math.abs(cx-streamX(cy))<120)continue;

    const split=rnd()<.45;
    if(split){s+=`<rect class="mb" x="${i*G+10}" y="${j*G+10}" width="${G/2-15}" height="${G-20}" rx="14"/><rect class="mb" x="${i*G+G/2+5}" y="${j*G+10}" width="${G/2-15}" height="${G-20}" rx="14"/>`}
    else s+=`<rect class="mb" x="${i*G+10}" y="${j*G+10}" width="${G-20}" height="${G-20}" rx="16"/>`;
  }
  PARKS.forEach(p=>s+=`<circle class="mp" cx="${p.x}" cy="${p.y}" r="${p.r}"/>`);
  let d='';for(let y=-WORLD;y<=WORLD;y+=60)d+=(d?'L':'M')+streamX(y).toFixed(1)+' '+y;

}

const toBlob=async dataUrl=>{const [head,b64]=dataUrl.split(',');const bin=atob(b64);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:(head.match(/data:([^;]+)/)||[])[1]||'image/jpeg'})};

async function aiRecognize(photo,cands){

  for(const c of cands){if(blobs.length>=Math.min(AI.max,5))break;if(c.photo){blobs.push(await toBlob(c.photo));used.push(c)}}
  const prompt=`이 앱은 길에서 만난 동물을 찍어 카드로 모으는 도감이에요. 이미지 1은 방금 찍은 사진이에요.${used.length?` 이미지 2~${used.length+1}은 도감에 이미 있는 동물들이에요(순서대로 후보 1~${used.length}).`:''}
이미지 1을 보고 JSON 객체 하나로만 답하세요:
{"isAnimal": 동물이 보이면 true,
 "species": "cat"|"dog"|"bird"|"etc",
 "coat": "${COAT_KEYS}" 중 하나 (cheese=주황/치즈, mackerel=회색 줄무늬 고등어, calico=삼색, tuxedo=검정+흰색 턱시도, white=흰색, black=검정, brown=갈색),
 "breed": 한국어로 짧게 추정한 품종 (예: "코리안숏헤어", "말티즈", "믹스로 보여요"),
 "name": 생김새에 어울리는 귀여운 한국어 별명 2~5글자,
 "note": 생김새나 자세를 담은 한국어 한 줄 설명, 25자 이내,
 "match": ${used.length?`이미지 1이 후보 중 같은 개체로 보이면 그 후보 번호(1~${used.length}), 아니면 null`:'null'},
 "matchConfidence": 0~1 사이 숫자}`;
  const r=await AI.json(prompt,blobs,'quick');

  return{isAnimal:r.isAnimal!==false,species:SPECIES[r.species]?r.species:'cat',coat:COATS[r.coat]?r.coat:null,breed:String(r.breed||'').slice(0,20),
    name:String(r.name||'').slice(0,12),note:String(r.note||'').slice(0,40),known:(m>=1&&m<=used.length&&Number(r.matchConfidence)>=.6)?used[m-1].id:null};

function analyze(L,all){
  const r=L.species==='cat'?(L.outdoor?1609:137):1609;
  const home=L.last||{x:0,y:0};const since=Date.now()-(L.when||0)*DAY-12*HOUR;
  let cands=Store.cards.filter(c=>c.species===L.species).map(c=>{
    const look=c.coat===L.coat?1:(NEAR[L.coat]||[]).includes(c.coat)?.45:0;
    const dist=Math.hypot(c.x-home.x,c.y-home.y);const dS=Math.max(0,1-dist/(r*1.6));
    const t=c.lastSeen||c.createdAt;const tS=t>=since?1:Math.max(0,1-(since-t)/(10*DAY));
    return{c,dist,dS,tS,look,score:Math.round((look*.6+dS*.25+tS*.15)*100)}
  }).sort((a,b)=>b.score-a.score);
  if(!all)cands=cands.filter(x=>x.score>=30).slice(0,5);
  return{r,home,cands,ai:false};
}

  if(L.species==='cat'&&!L.outdoor)t.push(['숨을 곳부터, 집 가까이부터','실내에서만 지낸 고양이는 멀리 가기보다 숨어요. 반경 '+r+'m 안의 차 밑, 실외기 뒤, 계단 아래, 덤불을 손전등으로 비춰 눈빛을 찾아보세요.']);
  if(L.species==='cat'&&L.outdoor)t.push(['다니던 길을 따라 넓게','외출하던 고양이는 평소 동선과 밥자리를 따라 움직여요. 지도의 닮은 기록이 있는 구역부터 순서대로 확인해요.']);
  if(L.species==='dog')t.push(['참고 자료는 고양이 기준이에요','강아지는 이동 거리가 더 길 수 있어 1.6km부터 넓게 잡았어요. 산책로와 큰길 쪽을 먼저 확인하고 근처 보호소에도 연락해 두세요.']);
  if(L.temper==='shy')t.push(['조용한 시간에, 쫓지 않고','겁 많은 아이는 사람이 적은 밤 10시 이후에 움직여요. 이름은 작게 부르고, 보이면 다가가지 말고 그 자리에 앉아 기다려 주세요. 설문 36명 중 4명이 다가가다 놓쳤어요.']);
  if(L.temper==='social')t.push(['이웃에게 사진을 보여주세요','사람을 좋아하는 아이는 남의 집이나 가게에 들어가기도 해요. 경비실, 편의점, 동물병원에 사진을 보여 주세요.']);
  t.push(['익숙한 냄새를 집 앞에',`평소 쓰던 모래, 담요와 ${L.snack&&L.snack!=='기타'?L.snack:'좋아하는 간식'}를 집 앞에 두면 돌아올 길을 찾는 데 도움이 돼요.`]);
  if(L.how==='door'||L.how==='window')t.push(['나간 곳 바로 앞부터',(L.how==='door'?'열린 문':'창문 아래')+' 주변 10m 안을 먼저 꼼꼼히 확인하세요. 가장 가까운 곳에 숨어 있는 경우가 많아요.']);
  return t;
}

/* 시연하는 곳이 어디든 지도와 찾기를 바로 써 볼 수 있게, 예시 카드를 지금 있는 곳 주변에 둬요 */
function relocateSamples(){
  if(Store.mode!=='local')return;
  const hm=getHome();let ch=false;
  Store.cards.forEach(c=>{
    if(!c.sample)return;
    const base=SAMPLES.find(s=>s.id===c.id);
    if(c.ox===undefined&&base){c.ox=base.ox;c.oy=base.oy;c.lsAgo=base.lsAgo;c.caAgo=base.caAgo}
    if(c.ox===undefined)return;
    const nx=hm.x+c.ox,ny=hm.y+c.oy;
    if(c.x!==nx||c.y!==ny||c.zone!==ZONE){c.x=nx;c.y=ny;c.zone=ZONE;ch=true}
    c.lastSeen=Date.now()-c.lsAgo;c.createdAt=Date.now()-c.caAgo;
  });
  if(ch)Store.saveLocal();
}

/* =====================================================================
   WANDER 식별 엔진 (patch engine, runs entirely in the browser)
   1 정규화  : 가운데 정사각형 256px
   2 조명    : 평균 밝기 → 밝기 배율(×f), 주변(테두리) 색이 다양하면 색 보정, 아니면 '주변색 단서 부족'
   3 영역    : 테두리 색과 다른 패치 = 동물 영역. 실패하면 전체 64패치 사용
   4 특징    : 8×8 = 64패치, 패치마다 색 분포 12 + 무늬 방향 8 + 무늬 밀도 1 = 21차원
   5 매칭    : 패치마다 상대 사진 ±2칸 안에서 가장 닮은 패치와 짝 (자세 차이 허용),
               무작위 짝 기준선보다 얼마나 닮았는지로 점수화, 양방향 평균
   6 원본/보정 둘 다 계산해 높은 쪽
   7 등록 여러 장: 최종 = 0.6 × 최고 + 0.4 × 상위 2장 평균
   ===================================================================== */
const ENG={N:256,G:8,cache:new Map(),
  TH:Object.assign({same:.75,cand:.55,src:'기본값'},lsGet('wander.th',{})),
  /* score = ½ 패치 유사도(0.80→0, 0.98→1) + ½ 위치 일관성(0.35→0, 0.95→1) */
  CAL:{simLo:.80,simHi:.98,consLo:.35,consHi:.95},
  Q:{dark:.28,bright:.78,blur:.018,plain:.06,small:14,regMin:2,close:.04}};
const BOXC=['#B58CFF','#6FA8FF','#F5B65A','#5FD08A'];
const dot=(a,b)=>{let s=0;for(let i=0;i<a.length;i++)s+=a[i]*b[i];return s};
const tick=()=>new Promise(r=>setTimeout(r,0));
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src})}

async function engPrep(src){
  if(ENG.cache.has(src))return ENG.cache.get(src);
  const img=await loadImg(src),N=ENG.N,c=document.createElement('canvas');c.width=c.height=N;
  const g=c.getContext('2d',{willReadFrequently:true});const s=Math.min(img.naturalWidth,img.naturalHeight);
  g.drawImage(img,(img.naturalWidth-s)/2,(img.naturalHeight-s)/2,s,s,0,0,N,N);
  const px=g.getImageData(0,0,N,N).data;
  const light=engLight(px),orig=engFeat(px),corr=engFeat(engCorrect(px,light)),fg=engForeground(orig);
  const r={orig,corr,light,fg,quality:engQuality(orig,light,fg)};
  if(ENG.cache.size>400)ENG.cache.clear();ENG.cache.set(src,r);return r;
}
function engLight(px){
  const N=ENG.N;let R=0,G=0,B=0,n=0,bR=0,bG=0,bB=0,bs=0,bn=0;
  for(let y=0;y<N;y+=2)for(let x=0;x<N;x+=2){const i=(y*N+x)*4,r=px[i]/255,g=px[i+1]/255,b=px[i+2]/255;R+=r;G+=g;B+=b;n++;
    if(x<32||y<32||x>=N-32||y>=N-32){bR+=r;bG+=g;bB+=b;bs+=Math.max(r,g,b)-Math.min(r,g,b);bn++}}
  R/=n;G/=n;B/=n;bR/=bn;bG/=bn;bB/=bn;bs/=bn;
  const lum=.299*R+.587*G+.114*B;
  const cue=bs>.12;                       // varied, colourful surroundings carry the light colour
  const gray=(bR+bG+bB)/3;
  const gains=cue?[bR,bG,bB].map(v=>Math.min(1.25,Math.max(.8,gray/(v||1e-3)))):[1,1,1];
  const factor=Math.min(1.8,Math.max(.6,.5/(lum||1e-3)));
  return{lum,factor:Math.round(factor*100)/100,gains,cue,state:lum<ENG.Q.dark?'dark':lum>ENG.Q.bright?'bright':'ok'};
}
function engCorrect(px,l){const o=new Uint8ClampedArray(px.length);
  for(let i=0;i<px.length;i+=4){o[i]=px[i]*l.gains[0]*l.factor;o[i+1]=px[i+1]*l.gains[1]*l.factor;o[i+2]=px[i+2]*l.gains[2]*l.factor;o[i+3]=255}return o}
function engFeat(px){
  const N=ENG.N,G=ENG.G,P=N/G,lum=new Float32Array(N*N);
  for(let i=0,j=0;i<px.length;i+=4,j++)lum[j]=(.299*px[i]+.587*px[i+1]+.114*px[i+2])/255;
  const out=[];
  for(let pj=0;pj<G;pj++)for(let pi=0;pi<G;pi++){
    const col=new Float32Array(12),tex=new Float32Array(8);let mR=0,mG=0,mB=0,mL=0,mL2=0,edge=0,n=0;
    for(let y=pj*P+1;y<(pj+1)*P-1;y+=2)for(let x=pi*P+1;x<(pi+1)*P-1;x+=2){
      const k=y*N+x,i=k*4,r=px[i]/255,g=px[i+1]/255,b=px[i+2]/255,l=lum[k];
      mR+=r;mG+=g;mB+=b;mL+=l;mL2+=l*l;n++;
      const o1=r-g,o2=(r+g)/2-b,ch=Math.hypot(o1,o2);
      if(ch>.04)col[Math.floor((Math.atan2(o2,o1)+Math.PI)/(2*Math.PI)*8)%8]+=ch;
      col[8+Math.min(3,Math.floor(l*4))]+=.15;
      const gx=lum[k+1]-lum[k-1],gy=lum[k+N]-lum[k-N],m=Math.hypot(gx,gy);
      if(m>.02){let a=Math.atan2(gy,gx);if(a<0)a+=Math.PI;tex[Math.floor(a/Math.PI*8)%8]+=m}
      edge+=m;
    }
    const nc=Math.hypot(...col)||1,nt=Math.hypot(...tex)||1,v=new Float32Array(21);
    for(let q=0;q<12;q++)v[q]=col[q]/nc*.75;for(let q=0;q<8;q++)v[12+q]=tex[q]/nt*.55;v[20]=Math.min(1,edge/n*6)*.35;
    const nv=Math.hypot(...v)||1;for(let q=0;q<21;q++)v[q]/=nv;
    out.push({v,i:pi,j:pj,mean:[mR/n,mG/n,mB/n],lum:mL/n,lstd:Math.sqrt(Math.max(0,mL2/n-(mL/n)**2)),edge:edge/n});
  }
  return out;
}
function engForeground(f){
  const border=f.filter(p=>p.i===0||p.j===0||p.i===7||p.j===7);
  const bg=[0,1,2].map(c=>border.reduce((a,p)=>a+p.mean[c],0)/border.length);
  const d=p=>Math.hypot(p.mean[0]-bg[0],p.mean[1]-bg[1],p.mean[2]-bg[2]);
  const bd=border.map(d),mu=bd.reduce((a,v)=>a+v,0)/bd.length,sd=Math.sqrt(bd.reduce((a,v)=>a+(v-mu)**2,0)/bd.length);
  const thr=Math.max(.08,mu+1.2*sd);
  const idx=f.map((p,k)=>d(p)>thr?k:-1).filter(k=>k>=0);
  if(idx.length<10||idx.length>56)return{mode:'all',idx:f.map((_,k)=>k)};
  return{mode:'fg',idx};
}
function engQuality(f,light,fg){
  const ps=fg.idx.map(k=>f[k]);
  const sharp=ps.reduce((a,p)=>a+p.edge,0)/ps.length;
  const m=ps.reduce((a,p)=>a+p.lum,0)/ps.length;
  const contrast=Math.sqrt(ps.reduce((a,p)=>a+(p.lum-m)**2+p.lstd**2,0)/ps.length);
  return{dark:light.state==='dark',bright:light.state==='bright',blurry:sharp<ENG.Q.blur,plain:contrast<ENG.Q.plain,
    small:fg.mode==='fg'&&fg.idx.length<ENG.Q.small,sharp,contrast,lum:light.lum,patches:fg.idx.length};
}
function engDir(fa,ia,fb,ib){
  const setB=new Set(ib),sims=[],pairs=[];
  for(const a of ia){const pa=fa[a];let best=-1,bk=-1;
    for(let dj=-2;dj<=2;dj++)for(let di=-2;di<=2;di++){const i=pa.i+di,j=pa.j+dj;if(i<0||j<0||i>7||j>7)continue;
      const b=j*8+i;if(!setB.has(b))continue;const s=dot(pa.v,fb[b].v);if(s>best){best=s;bk=b}}
    if(bk>=0){sims.push(best);pairs.push([a,bk,best])}}
  if(!sims.length)return{score:0,sim:0,cons:0,pairs:[]};
  sims.sort((x,y)=>y-x);const top=sims.slice(0,Math.max(1,Math.ceil(sims.length*.7)));
  const m=top.reduce((x,y)=>x+y,0)/top.length;
  // spatial consistency: for the same animal most patches move by the same offset (pose shift)
  const ds=pairs.map(([a,b])=>[(b%8)-(a%8),Math.floor(b/8)-Math.floor(a/8)]);
  const med=k=>{const v=ds.map(d=>d[k]).sort((x,y)=>x-y);return v[Math.floor(v.length/2)]},mx=med(0),my=med(1);
  const cons=ds.filter(d=>Math.abs(d[0]-mx)<=1&&Math.abs(d[1]-my)<=1).length/ds.length;
  const clamp=v=>Math.max(0,Math.min(1,v));
  const score=.5*clamp((m-ENG.CAL.simLo)/(ENG.CAL.simHi-ENG.CAL.simLo))+.5*clamp((cons-ENG.CAL.consLo)/(ENG.CAL.consHi-ENG.CAL.consLo));
  return{score,sim:m,cons,pairs};
}
function engPairScore(A,B){
  const o1=engDir(A.orig,A.fg.idx,B.orig,B.fg.idx),o2=engDir(B.orig,B.fg.idx,A.orig,A.fg.idx);
  const c1=engDir(A.corr,A.fg.idx,B.corr,B.fg.idx),c2=engDir(B.corr,B.fg.idx,A.corr,A.fg.idx);
  const orig=(o1.score+o2.score)/2,corr=(c1.score+c2.score)/2,w=corr>orig?[c1,c2]:[o1,o2];
  return{score:Math.max(orig,corr),orig,corr,sim:(w[0].sim+w[1].sim)/2,cons:(w[0].cons+w[1].cons)/2,pairs:w[0].pairs};
}
const engAgg=list=>{const t=list.slice().sort((x,y)=>y-x);return t.length>=2?.6*t[0]+.4*(t[0]+t[1])/2:(t[0]||0)};
/* query = witness photo (길에서 찍힌 목격 사진), regs = owner's registered photos */
async function engMatch(qSrc,regs,labels){
  const Q=await engPrep(qSrc),R=[];for(const s of regs)R.push(await engPrep(s));
  const per=R.map((B,k)=>({k,...engPairScore(Q,B)}));
  const best=per.slice().sort((a,b)=>b.score-a.score)[0];
  const final=engAgg(per.map(p=>p.score));
  return{final,best,q:Q,regQ:R,
    list:per.map(p=>({label:(labels&&labels[p.k])||('사진 '+(p.k+1)),score:p.score})).sort((a,b)=>b.score-a.score),
    unc:engUnc(Q,R,{})};
}
function engUnc(Q,R,extra){
  const items=[],qq=Q.quality,TQ=ENG.Q;
  const add=(why,fix)=>items.push([why,fix]);
  if(qq.dark)add(`목격 사진이 어두워요 (밝기 ${qq.lum.toFixed(2)} < ${TQ.dark})`,'보정 점수를 같이 봤어요. 밝을 때 찍힌 목격 사진이 더 오면 다시 비교하세요');
  if(qq.bright)add(`역광 · 과노출 (밝기 ${qq.lum.toFixed(2)} > ${TQ.bright})`,'그늘에서 찍힌 사진으로 다시 비교하세요');
  if(qq.blurry)add(`사진이 흐려요 (선명도 ${qq.sharp.toFixed(3)} < ${TQ.blur})`,'흔들리지 않은 사진이 필요해요');
  if(qq.small)add(`동물이 작게 찍혔어요 (동물 영역 ${qq.patches}패치 < ${TQ.small})`,'화면 절반 이상 차게 찍힌 사진이 필요해요');
  if(qq.plain)add(`무늬 단서가 적어요 (무늬 대비 ${qq.contrast.toFixed(3)} < ${TQ.plain}, 단색 계열)`,'특징 부위(꼬리 끝, 귀, 얼룩) 사진을 추가하고 위치 · 시간 정보를 더 믿으세요');
  if(R.length<TQ.regMin)add(`등록 사진 ${R.length}장 (기준: ${TQ.regMin}장 이상 · 뒷모습 포함)`,'뒷모습 사진을 추가하면 길에서 찍힌 사진과 맞추기 쉬워요');
  const darkReg=R.filter(x=>x.quality.dark).length;if(darkReg)add(`어두운 등록 사진 ${darkReg}장`,'창가 자연광에서 다시 찍어 바꿔 주세요');
  if(extra.close)add(`다음 후보와 점수 차가 작아요 (${TQ.close} 미만)`,'위에서 본 등 무늬 사진을 추가하면 두 아이를 구분하기 쉬워요');
  const level=items.length===0?'낮음':items.length<=2?'보통':'높음';
  return{level,items};
}
/* 점수는 줄 세우기에만 써요. 같은 고양이인지는 보호자가 확인해요 */
function verdict(s){return s>=ENG.TH.same?['아주 닮음','v-same']:s>=ENG.TH.cand?['후보','v-cand']:['닮음 낮음','v-low']}
function pickBoxes(pairs){
  const out=[];for(const p of pairs.slice().sort((a,b)=>b[2]-a[2])){
    const ai=p[0]%8,aj=Math.floor(p[0]/8);
    if(out.every(o=>Math.abs(o.ai-ai)+Math.abs(o.aj-aj)>=2))out.push({ai,aj,bi:p[1]%8,bj:Math.floor(p[1]/8),c:BOXC[out.length]});
    if(out.length===4)break}
  return out;
}
const boxesSVG=list=>`<svg viewBox="0 0 8 8" preserveAspectRatio="none" aria-hidden="true">${list.map(([i,j,c])=>`<rect x="${i+.06}" y="${j+.06}" width=".88" height=".88" rx=".08" fill="none" stroke="${c}" stroke-width="2.5" vector-effect="non-scaling-stroke"/>`).join('')}</svg>`;
const tintSVG=idx=>`<svg viewBox="0 0 8 8" preserveAspectRatio="none" aria-hidden="true">${idx.map(k=>`<rect x="${k%8}" y="${Math.floor(k/8)}" width="1.02" height="1.02" fill="#5FD08A" fill-opacity=".38"/>`).join('')}</svg>`;
function uncHTML(u){return `<div class="unc"><b>인식 불확도 · ${u.level}</b>${u.items.length?`<ul style="margin:0;padding-left:18px">${u.items.map(([a,b])=>`<li>${h(a)}<small>${h(b)}</small></li>`).join('')}</ul>`:'조명 · 선명도 · 등록 사진 수 모두 기준 안이에요.'}</div>`}
function engCardHTML(r,qSrc,regSrcs,title){
  const [vt,vc]=verdict(r.final),B=pickBoxes(r.best.pairs);
  return `<div class="eng">
    <div class="eng-head"><b style="font-size:15px;min-width:0">${h(title||'엔진 비교 결과')}</b><span style="display:flex;align-items:center;gap:8px"><span class="verdict ${vc}">${vt}</span><span class="big-score">${r.final.toFixed(3)}</span></span></div>
    <div class="eng-imgs">
      <figure><div class="ov-img"><img src="${qSrc}" alt="목격 사진">${boxesSVG(B.map(b=>[b.ai,b.aj,b.c]))}</div><figcaption>목격 사진 · 일치에 쓰인 부분</figcaption></figure>
      <figure><div class="ov-img tint"><img src="${qSrc}" alt="">${tintSVG(r.q.fg.idx)}</div><figcaption>초록색 · 비교에 사용한 영역</figcaption></figure>
      <figure><div class="ov-img"><img src="${regSrcs[r.best.k]}" alt="가장 가까운 등록 사진">${boxesSVG(B.map(b=>[b.bi,b.bj,b.c]))}</div><figcaption>가장 가까운 등록 사진</figcaption></figure>
    </div>
    <div class="eng-metrics">
      <div><span>영역</span><b>${r.q.fg.mode==='all'?'전체 사진 사용':'동물 영역만 사용'} · 패치 ${r.q.fg.idx.length}개</b></div>
      <div><span>조명</span><b>${r.q.light.cue?'주변색으로 색 보정':'주변색 단서 부족'} · 밝기 ×${r.q.light.factor.toFixed(2)}</b></div>
      <div><span>부분 비교</span><b>원본 ${r.best.orig.toFixed(3)} / 보정 ${r.best.corr.toFixed(3)}</b></div>
      <div><span>근거</span><b>패치 유사도 ${r.best.sim.toFixed(3)} · 위치 일관성 ${Math.round(r.best.cons*100)}%</b></div>
      ${r.list.map(x=>`<div><span>${h(x.label)}</span><b>${x.score.toFixed(3)}</b></div>`).join('')}
      <div><span>판정 기준 (${h(ENG.TH.src)})</span><b>동일 ≥ ${ENG.TH.same.toFixed(2)} · 후보 ≥ ${ENG.TH.cand.toFixed(2)}</b></div>
    </div>
    ${uncHTML(r.unc)}
  </div>`;
}

/* ---------- 표준 등록 사진 가이드 ---------- */
const SLOTS=[
  {k:'front',t:'정면',d:'얼굴 무늬가 보이게'},
  {k:'side',t:'옆모습',d:'몸통 무늬 전체'},
  {k:'back',t:'뒷모습',d:'길에서 가장 많이 찍혀요',req:true},

function qualityBadges(Q){
  const q=Q.quality,o=[];
  if(q.dark)o.push(['warn','어두워요 · 창가 자연광에서']);else if(q.bright)o.push(['warn','너무 밝아요 · 그늘에서']);

  if(q.small)o.push(['warn','작아요 · 더 가까이']);

/* ---------- lost search on the engine ---------- */
async function analyzeEngine(L,onProg){
  const base=analyze(L,true);
  if(!L.photos.length)return analyze(L);
  const regs=L.photos.map(p=>p.photo),labels=L.photos.map((p,i)=>p.label||('등록 사진 '+(i+1)));
  const pool=base.cands.filter(x=>x.c.photo);
  for(let i=0;i<pool.length;i++){pool[i].eng=await engMatch(pool[i].c.photo,regs,labels);onProg&&onProg(i+1,pool.length);await tick()}
  const ranked=pool.slice().sort((a,b)=>b.eng.final-a.eng.final);
  if(ranked.length>1&&ranked[0].eng.final-ranked[1].eng.final<ENG.Q.close){ranked[0].eng.unc=engUnc(ranked[0].eng.q,ranked[0].eng.regQ,{close:true})}
  base.cands.forEach(x=>{x.score=x.eng?Math.round(x.eng.final*60+x.dS*25+x.tS*15):Math.round(x.look*35+x.dS*25+x.tS*15)});
  const cands=base.cands.filter(x=>x.score>=30).sort((a,b)=>b.score-a.score).slice(0,5);
  return{...base,cands,engine:true,regs,labels};
}

class RealMap{
  constructor(el,opt={}){
    this.el=el;this.opt=opt;this.data={cards:[]};

    el.innerHTML=`<div class="rm-canvas" style="position:absolute;inset:0"></div><div class="map-ui"><span class="pill" style="font-size:12px">150m 구역 단위로만 보여요<button class="info-i" data-zoneinfo aria-label="150m 구역 설명">i</button></span><button class="pill rm-loc" aria-label="내 위치">◎ 내 위치</button></div><div class="pop-slot"></div>`;
    const c0=xy2ll(opt.cx||0,opt.cy||0);
    this.m=L.map(el.querySelector('.rm-canvas'),{zoomControl:false,attributionControl:false,minZoom:10,maxZoom:19}).setView([c0.lat,c0.lng],16);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(this.m);
    L.control.attribution({prefix:false,position:'bottomright'}).addAttribution('© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>').addTo(this.m);
    L.control.zoom({position:'topright'}).addTo(this.m);
    this.layer=L.layerGroup().addTo(this.m);this.meLayer=L.layerGroup().addTo(this.m);
    this.m.on('click',e=>{if(opt.onTap){const p=ll2xy(e.latlng.lat,e.latlng.lng);opt.onTap(p.x,p.y)}});
    el.querySelector('.rm-loc').onclick=()=>this.locate(true,true);
    if(opt.half)this.center(opt.cx||0,opt.cy||0,opt.half);
    this.ro=new ResizeObserver(()=>this.m.invalidateSize());this.ro.observe(el);
    setTimeout(()=>{this.m.invalidateSize();if(!opt.noLocate)this.locate(!(opt.cx||opt.cy||opt.half),false)},150);
  }
  async locate(centerIt,tell){
    const p=await getHere();
    if(!p){if(tell)toast('위치를 읽을 수 없어요. 설정에서 위치를 허용해 주세요.');return}
    const ll=xy2ll(p.x,p.y);this.meLayer.clearLayers();
    if(p.acc&&p.acc<400)L.circle([ll.lat,ll.lng],{radius:p.acc,color:'#2F6BFF',weight:1,fillColor:'#2F6BFF',fillOpacity:.1,interactive:false}).addTo(this.meLayer);
    L.circleMarker([ll.lat,ll.lng],{radius:8,color:'#fff',weight:3,fillColor:'#2F6BFF',fillOpacity:1,interactive:false}).addTo(this.meLayer);
    if(centerIt)this.m.setView([ll.lat,ll.lng],17,{animate:false});
  }
  set(d){
    Object.assign(this.data,d);const D=this.data;this.layer.clearLayers();
    (D.cards||[]).forEach(c=>{
      const ll=xy2ll(snap(c.x),snap(c.y));
      L.circle([ll.lat,ll.lng],{radius:CELL/2,color:'#6573E3',weight:1.5,fillColor:'#6573E3',fillOpacity:.14,interactive:false}).addTo(this.layer);
      const ic=L.divIcon({className:'rm-mk',html:`<div class="rm-ph" style="background-image:url('${String(c.photo||'').replace(/'/g,'%27')}')"></div>`,iconSize:[40,40],iconAnchor:[20,20]});
      L.marker([ll.lat,ll.lng],{icon:ic,keyboard:false}).on('click',()=>{this.opt.onCard&&this.opt.onCard(c.id)}).addTo(this.layer);
    });
    if(D.pick){const ll=xy2ll(D.pick.x,D.pick.y);
      L.circle([ll.lat,ll.lng],{radius:CELL/2,color:'#F0607E',weight:2,dashArray:'6 5',fillColor:'#F0607E',fillOpacity:.1,interactive:false}).addTo(this.layer);
      L.circleMarker([ll.lat,ll.lng],{radius:9,color:'#fff',weight:3,fillColor:'#F0607E',fillOpacity:1,interactive:false}).addTo(this.layer)}
  }
  center(x,y,half){
    const a=xy2ll(x-(half||300),y-(half||300)),b=xy2ll(x+(half||300),y+(half||300));
    this.m.fitBounds([[Math.min(a.lat,b.lat),Math.min(a.lng,b.lng)],[Math.max(a.lat,b.lat),Math.max(a.lng,b.lng)]],{animate:false});
  }
  destroy(){this.ro.disconnect();this.m.remove()}
}

const Cam={stream:null,track:null,facing:'environment',state:'idle',open:true,det:null,detState:'idle',
  box:null,cls:null,seenAt:0,match:null,matchAt:0,matching:false,torch:false};
const CK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

function camOpen(){Cam.open=true;$('#cam').hidden=false;renderCamSide();camStart();if(Cam.det)detLoop()}
function camClose(){Cam.open=false;$('#cam').hidden=true;camStop()}
function camMsg(html){const m=$('#camMsg');m.hidden=!html;m.innerHTML=html||''}
async function camStart(){
  if(Cam.stream||Cam.state==='starting')return;
  if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)||!window.isSecureContext){Cam.state='unsupported';camFallback();return}
  Cam.state='starting';
  try{
    const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:Cam.facing},width:{ideal:1920},height:{ideal:1080}},audio:false});
    if(!Cam.open||document.hidden){s.getTracks().forEach(t=>t.stop());Cam.state='idle';return}
    Cam.stream=s;Cam.track=s.getVideoTracks()[0];
    const v=$('#camVideo');v.srcObject=s;v.hidden=false;await v.play().catch(()=>{});
    $('#camStill').hidden=true;Cam.state='live';camMsg('');
    let caps={};try{caps=Cam.track.getCapabilities?Cam.track.getCapabilities():{}}catch(e){}
    $('#camTorch').hidden=!caps.torch;
    loadDetector();
  }catch(e){Cam.state=(e&&(e.name==='NotAllowedError'||e.name==='SecurityError'))?'denied':'error';camFallback()}
}
function camFallback(){
  $('#camVideo').hidden=true;$('#camStill').hidden=false;$('#camTorch').hidden=true;
  const inClaude=!!(window.claude&&window.claude.use);
  $('#arHint').innerHTML=inClaude?'셔터를 누르면 휴대폰 카메라가 열려요<small>화면 안에서 바로 찍는 AR 카메라는 홈 화면 앱 버전에서 켜져요</small>'
    :Cam.state==='denied'?'카메라 권한이 꺼져 있어요<small>설정에서 카메라를 허용하면 바로 찍을 수 있어요</small>':'셔터를 누르면 휴대폰 카메라가 열려요<small>이 브라우저에서는 카메라를 바로 켤 수 없어요</small>';
  $('#arHint').hidden=false;
  camMsg(!inClaude&&Cam.state==='denied'?'<button id="camRetry">카메라 다시 켜기</button>':'');
  const r=$('#camRetry');if(r)r.onclick=()=>{Cam.state='idle';camStart()};
}
function camStop(){
  if(Cam.stream){Cam.stream.getTracks().forEach(t=>t.stop());Cam.stream=null;Cam.track=null}
  $('#camVideo').srcObject=null;if(Cam.state==='live'||Cam.state==='starting')Cam.state='idle';
  Cam.torch=false;$('#camTorch').setAttribute('aria-pressed','false');
}
function loadScript(src){return new Promise((res,rej)=>{if([...document.scripts].some(s=>s.src===src))return res();const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
async function loadDetector(){
  if(Cam.det){detLoop();return}
  if(Cam.detState==='loading'||Cam.detState==='failed')return;
  Cam.detState='loading';
  try{
    if(!window.cocoSsd){await loadScript(TFJS);await loadScript(COCO)}
    Cam.det=await window.cocoSsd.load({base:'lite_mobilenet_v2'});Cam.detState='ready';detLoop();
  }catch(e){Cam.detState='failed';$('#arHint').innerHTML='가운데 칸에 동물을 맞춰 찍어 주세요<small>자동 인식을 불러오지 못했어요 · 촬영과 카드 만들기는 그대로 돼요</small>'}
}
let detBusy=false,detTimer=0;
function detLoop(){
  clearTimeout(detTimer);
  detTimer=setTimeout(async()=>{
    if(!Cam.open)return;                                  // camera screen closed: stop until camOpen
    if(Cam.state!=='live'||!Cam.det){detLoop();return}  // camera restarting or model loading: keep waiting
    const v=$('#camVideo');
    if(v.readyState>=2&&!detBusy){
      detBusy=true;
      try{
        const preds=await Cam.det.detect(v,6,.42);
        const hit=preds.filter(p=>DET_KO[p.class]).sort((a,b)=>b.score*b.bbox[2]*b.bbox[3]-a.score*a.bbox[2]*a.bbox[3])[0];
        if(hit){Cam.box=hit.bbox;Cam.cls=hit.class;Cam.seenAt=Date.now();arMatch()}
      }catch(e){}
      detBusy=false;
    }
    arDraw();detLoop();
  },180);
}
/* video pixels -> screen pixels for object-fit: cover */
function toScreen(b){
  const v=$('#camVideo'),W=innerWidth,H=innerHeight,vw=v.videoWidth||W,vh=v.videoHeight||H,k=Math.max(W/vw,H/vh),ox=(W-vw*k)/2,oy=(H-vh*k)/2;
  return{x:b[0]*k+ox,y:b[1]*k+oy,w:b[2]*k,h:b[3]*k};
}
function arDraw(){
  const box=$('#arBox'),lab=$('#arLabel'),hint=$('#arHint');
  const live=Cam.box&&Date.now()-Cam.seenAt<900;
  if(!live){Cam.match=null;box.classList.add('guide');Object.assign(box.style,{left:'15%',top:'24%',width:'70%',height:'44%'});lab.hidden=true;if(Cam.detState!=='failed')hint.hidden=false;return}
  const r=toScreen(Cam.box),pad=10;
  box.classList.remove('guide');
  Object.assign(box.style,{left:(r.x-pad)+'px',top:(r.y-pad)+'px',width:(r.w+pad*2)+'px',height:(r.h+pad*2)+'px'});
  hint.hidden=true;
  const m=Cam.match&&Store.cards.find(c=>c.id===Cam.match.id);
  lab.innerHTML=m?`<span class="ck">${CK}</span>${h(m.name)} 같아요`:`<span class="ck">${CK}</span>${DET_KO[Cam.cls]||'동물'}가 보여요`;
  lab.hidden=false;
  const lx=Math.max(12,Math.min(innerWidth-lab.offsetWidth-12,r.x-pad)),ly=Math.max(90,r.y-pad-48);
  lab.style.left=lx+'px';lab.style.top=ly+'px';
}
/* crop what is inside the AR box (padded, square) from the live frame */
function grabCrop(size=520,pad=.14){
  const v=$('#camVideo'),vw=v.videoWidth,vh=v.videoHeight;if(!vw)return null;
  let sx,sy,s;
  if(Cam.box&&Date.now()-Cam.seenAt<900){const [x,y,w,hh]=Cam.box;s=Math.min(Math.max(w,hh)*(1+pad*2),Math.min(vw,vh));sx=x+w/2-s/2;sy=y+hh/2-s/2}
  else{ // what the guide frame shows
    const W=innerWidth,H=innerHeight,k=Math.max(W/vw,H/vh),ox=(W-vw*k)/2,oy=(H-vh*k)/2;
    const gw=W*.7,gh=H*.44,cx=W/2,cy=H*.24+gh/2;s=Math.min(Math.max(gw,gh)/k,Math.min(vw,vh));sx=(cx-ox)/k-s/2;sy=(cy-oy)/k-s/2}
  sx=Math.max(0,Math.min(vw-s,sx));sy=Math.max(0,Math.min(vh-s,sy));
  const c=document.createElement('canvas');c.width=c.height=size;c.getContext('2d').drawImage(v,sx,sy,s,s,0,0,size,size);return c;
}
async function arMatch(){
  if(Cam.matching||Date.now()-Cam.matchAt<2500)return;
  const pool=Store.cards.filter(c=>c.photo&&(!Cam.cls||c.species===({cat:'cat',dog:'dog',bird:'bird'}[Cam.cls]||c.species)));
  if(!pool.length)return;
  Cam.matching=true;Cam.matchAt=Date.now();
  try{
    const c=grabCrop(256,.1);if(!c)return;
    const Q=await engPrep(c.toDataURL('image/jpeg',.8));let best=null;
    for(const card of pool){const B=await engPrep(card.photo);const s=engPairScore(Q,B).score;if(!best||s>best.s)best={id:card.id,s}}
    Cam.match=best&&best.s>=ENG.TH.cand?{id:best.id,score:best.s}:null;
  }catch(e){}finally{Cam.matching=false}
}
function renderCamSide(){
  $('#camCount').textContent=Store.cards.length;
}
async function camShot(){
  if(Cam.state!=='live')return $('#camInput').click();
  const c=grabCrop(560);if(!c)return $('#camInput').click();
  const f=$('#camFlash');f.classList.add('on');setTimeout(()=>f.classList.remove('on'),70);
  const hint={match:Cam.match,cls:Cam.cls&&Date.now()-Cam.seenAt<900?Cam.cls:null};
  const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.9));
  camClose();
  if(b)startCreate(new File([b],'wander.jpg',{type:'image/jpeg'}),hint);
}
$('#shutter').onclick=camShot;
$('#camClose').onclick=()=>{camClose();show(current==='camera'?'home':current)};
$('#camAlbum').onclick=()=>$('#albumInput').click();
$('#camDex').onclick=()=>{camClose();show('dex')};
$('#fabCam').onclick=camOpen;
$('#camTorch').onclick=async()=>{if(!Cam.track)return;Cam.torch=!Cam.torch;try{await Cam.track.applyConstraints({advanced:[{torch:Cam.torch}]});$('#camTorch').setAttribute('aria-pressed',Cam.torch)}catch(e){Cam.torch=false;$('#camTorch').hidden=true}};
['#camInput','#albumInput'].forEach(s=>$(s).addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(f){camClose();startCreate(f,{})}}));
document.addEventListener('visibilitychange',()=>{if(document.hidden)camStop();else if(Cam.open)camStart()});
addEventListener('resize',()=>{if(Cam.open)arDraw()});

/* ---------- 찾기 글 (실종 게시물) ----------
   채팅에서 물어본 내용(종류 · 생김새 · 언제부터 · 평소 · 마지막 본 곳 · 나간 방법 · 사진)을 글로 올려 두면,
   도감에 조건이 맞는 동물이 올라올 때 글쓴이에게 알림이 가요.
   조건: 같은 종류 · 마지막 본 곳에서 반경(실내 137m / 외출 1,609m) 안 · 못 본 날 이후에 찍힘 · 사진이 닮음(엔진 후보 기준 이상)
   글에는 집 위치 대신 150m 칸의 가운데만 저장해요. */
async function shrink(src,size=300){const img=await loadImg(src);const c=document.createElement('canvas');c.width=c.height=size;c.getContext('2d').drawImage(img,0,0,size,size);return c.toDataURL('image/jpeg',.65)}
function postFromF(f){
  const L=lostOf(f);
  return{id:uid(),by:Store.me,name:f.name||'우리 아이',species:f.species,speciesLabel:speciesLabel(f),traits:f.traits.slice(),
    since:f.since?f.since[1]:'',sinceTs:Date.now()-(L.when||0)*DAY-12*HOUR,outdoor:L.outdoor,outdoorLabel:f.say.outdoor||'',
    last:{x:snap(L.last.x),y:snap(L.last.y)},lastLabel:f.say.last||L.last.label,how:f.say.how||'',temper:f.say.temper||'',
    photos:[],status:'open',at:Date.now(),zone:ZONE};
}
async function registerPost(f){
  const p=postFromF(f);
  for(const s of SLOTS){const ph=f.photos[s.k];if(ph)p.photos.push(await shrink(ph.photo))}
  await Store.addPost(p);
  const n=await matchPostAgainstCards(p);
  return{p,n};
}
/* 글 조건에 카드가 맞는지: 맞으면 사진 점수, 아니면 null */
async function postScore(p,card){
  if(p.species!==card.species||!card.photo||!(p.photos&&p.photos.length))return null;
  const R=p.outdoor?1609:137;
  if(Math.hypot(card.x-p.last.x,card.y-p.last.y)>R+CELL)return null;
  if((card.lastSeen||card.createdAt||0)<p.sinceTs)return null;
  const Q=await engPrep(card.photo);let best=0;
  for(const ph of p.photos){const s=engPairScore(Q,await engPrep(ph)).score;if(s>best)best=s}
  return best>=ENG.TH.cand?best:null;
}
async function notifyMatch(p,card,score){
  if(Store.alerts.some(a=>a.type==='lostmatch'&&a.postId===p.id&&a.cardId===card.id))return false;
  await Store.addAlert({id:uid(),type:'lostmatch',to:p.by,postId:p.id,postName:p.name,cardId:card.id,cardName:card.name,score:+score.toFixed(3),at:Date.now()});
  return true;
}
async function checkLostPosts(card){            // 카드를 저장한 뒤: 열린 글마다 조건 확인
  for(const p of Store.posts.filter(x=>x.status==='open')){
    try{const s=await postScore(p,card);if(s!=null&&await notifyMatch(p,card,s)&&p.by===Store.me)pushMatch(p)}catch(e){}
  }
}
async function matchPostAgainstCards(p){        // 글을 등록한 뒤: 이미 도감에 있는 카드 확인
  let n=0;for(const c of Store.cards){try{const s=await postScore(p,c);if(s!=null&&await notifyMatch(p,c,s))n++}catch(e){}}return n;
}
function pushMatch(p){
  const r=$('#pushRoot');
  r.innerHTML=`<button class="push" id="pushMatchBtn"><span class="app-ic">WANDER</span><div><small>WANDER</small><p>${h(p.name)} 찾기 글과 닮은 기록이 올라왔어요</p></div><time>방금</time></button>`;
  const t=setTimeout(()=>r.innerHTML='',7000);
  $('#pushMatchBtn').onclick=()=>{clearTimeout(t);r.innerHTML='';openPost(p.id)};
}
const lostMatchAlert=x=>`<div class="alert"><div style="flex:1"><small>WANDER · ${ago(x.at)}</small><p>내가 등록한 ${h(x.postName)} 찾기 글과 닮은 기록이 올라왔어요 · ${h(x.cardName)} (엔진 ${x.score})</p><div class="req-actions"><button class="btn light small" data-cardopen="${h(x.cardId)}">카드 보기</button><button class="btn ink small" data-postopen="${h(x.postId)}">글 보기</button></div></div></div>`;

const postRows=p=>[['종류',p.speciesLabel||SPECIES[p.species]],['생김새',(p.traits&&p.traits.length)?p.traits.join(', '):'-'],['못 본 때',p.since||'-'],['평소',p.outdoorLabel||'-'],['마지막 본 곳',p.lastLabel||'-'],['나간 방법',p.how||'-'],['낯선 사람',p.temper||'-']]
  .map(([k,v])=>`<div class="lrow"><div><b>${k}</b><span>${h(v)}</span></div></div>`).join('');
const postBody=(p,photos)=>`<div class="panel" style="margin-top:0"><div style="display:flex;gap:8px;overflow-x:auto;padding-bottom:4px">${(photos||p.photos).map(s=>`<img src="${s}" alt="" style="width:76px;height:76px;border-radius:14px;object-fit:cover;flex:none">`).join('')}</div><div style="margin-top:10px;font-size:20px;font-weight:800;letter-spacing:-.02em">${h(p.name)}</div></div><div class="list">${postRows(p)}</div>`;
const postCond=p=>`<p class="notice">알림 조건: 같은 종류 · 마지막 본 곳 주변(${p.outdoor?'1,609m':'137m'}) 안 · 못 본 날 이후에 찍힘 · 사진이 닮음</p>`;

function openPost(id){
  const p=Store.posts.find(x=>x.id===id);if(!p){toast('글을 찾을 수 없어요');return}
  const ms=Store.alerts.filter(a=>a.type==='lostmatch'&&a.postId===id),mine=p.by===Store.me;
  const el=openSheet(`${topBar('찾기 글')}<div class="sheet-body gut">
    <div style="display:flex;gap:8px;align-items:center;margin:2px 0 10px"><span class="${p.status==='found'?'tag':'pill-pink'}">${p.status==='found'?'찾았어요':'찾는 중'}</span><span class="notice" style="padding:0">${fmtDT(p.at)} 등록</span></div>
    ${postBody(p)}${postCond(p)}
    <div class="sec">닮은 기록 <small>${ms.length}건</small></div>
    ${ms.length?ms.map(a=>{const c=Store.cards.find(x=>x.id===a.cardId);return `<button class="cand-row" data-card="${h(a.cardId)}" style="margin-bottom:8px">${c&&c.photo?`<img src="${c.photo}" alt="">`:'<span class="ph"></span>'}<div><b>${h(a.cardName)}</b><small>엔진 점수 ${a.score} · ${ago(a.at)}</small></div><span class="more">›</span></button>`}).join(''):'<div class="tip">아직 없어요. 도감에 조건이 맞는 동물이 올라오면 알림이 가요.</div>'}
    <div id="postActs"></div></div>`);
  wireClose(el);bindCards(el);

    $('#pDel').onclick=()=>{acts.innerHTML=`<div class="confirm"><b>이 글을 삭제할까요?</b><span class="notice" style="padding:0">삭제하면 더 이상 알림이 가지 않아요.</span><div class="actions"><button class="btn light" id="pNo">그대로 두기</button><button class="btn primary" id="pYes">삭제</button></div></div>`;
      $('#pNo').onclick=base;$('#pYes').onclick=async()=>{try{await Store.removePost(id);closeSheet();toast('글을 삭제했어요')}catch(e){toast('삭제하지 못했어요. 잠시 후 다시 눌러 주세요.')}}};
  };

function alertLine(a){

  if(a.type==='thanks')return `${a.lostName} 집에 돌아왔어요 · “${a.msg||'고마워요'}”`;
  return `${a.cardName} 카드가 ${a.lostName} 찾기의 단서가 됐어요`;

function openMyPage(){

  const mine=Store.posts.filter(x=>x.by===me).sort((a,b)=>b.at-a.at);
  const cnt=x=>Store.alerts.filter(a=>a.type==='lostmatch'&&a.postId===x.id).length;
  const myAl=Store.alerts.filter(a=>!a.to||a.to===me).sort((a,b)=>b.at-a.at);
  const pend=Store.requests.filter(r=>r.status==='pending'&&(!r.to||r.to===me)).length;
  const recent=Store.cards.slice().sort((a,b)=>(b.lastSeen||0)-(a.lastSeen||0)).slice(0,5);
  const head=(t,extra='')=>`<div class="mpc-head"><b>${t}${extra}</b><span class="more">전체 ›</span></div>`;
  const el=openSheet(`${topBar('마이페이지')}<div class="sheet-body gut">
    <div class="profile-card">${avatarHTML(64,pf.name,pf.medal)}<div class="pc-main"><div class="pc-name">${h(pf.name||'나')}</div>${rep?`<span class="pc-medal">${medalSVG(rep.k)}${h(rep.name)}</span>`:'<span class="pc-medal none">대표 훈장을 골라 보세요</span>'}</div><button class="btn soft small" id="mpEdit">편집</button></div>
    <div class="lv-card"><div class="lv-top"><b>Lv.${LV.lv} ${h(LV.name)}</b><span>${LV.exp} XP</span></div><div class="progress"><i style="width:${LV.pct}%"></i></div>
      <div class="notice" style="padding:6px 0 0">${LV.next?`다음 레벨까지 카드 ${LV.next.cards}장 · Lv.${LV.next.lv} ${h(LV.next.name)}`:'최고 레벨이에요'}</div>

function tilt(el){
  if(!el)return;
  const move=e=>{const r=el.getBoundingClientRect(),px=(e.clientX-r.left)/r.width,py=(e.clientY-r.top)/r.height;
    el.style.transform=`perspective(900px) rotateY(${(px-.5)*16}deg) rotateX(${(.5-py)*14}deg)`;el.style.setProperty('--gx',px*100+'%');el.style.setProperty('--gy',py*100+'%');el.classList.add('tilting')};
  const reset=()=>{el.style.transform='';el.classList.remove('tilting')};
  el.addEventListener('pointermove',move);el.addEventListener('pointerdown',move);el.addEventListener('pointerleave',reset);el.addEventListener('pointerup',()=>setTimeout(reset,350));el.addEventListener('pointercancel',reset);
}

/* ---------- location: real GPS where allowed, private; public card keeps a 150m zone ---------- */
function getHere(){
  return new Promise(res=>{
    if(!navigator.geolocation)return res(null);
    const to=setTimeout(()=>res(null),6000);
    try{navigator.geolocation.getCurrentPosition(p=>{clearTimeout(to);
      const q=ll2xy(p.coords.latitude,p.coords.longitude),x=q.x,y=q.y;
      res({x,y,acc:p.coords.accuracy})},()=>{clearTimeout(to);res(null)},{enableHighAccuracy:true,timeout:5500,maximumAge:60000})}catch(e){clearTimeout(to);res(null)}
  });
}

/* ---------- capture -> card ---------- */
async function startCreate(file,hint){
  const url=URL.createObjectURL(file);
  const el=openSheet(`${topBar('카드 만드는 중')}<div class="sheet-body gut"><div class="scan" id="scanBox"><img src="${url}" alt=""></div><p class="sub" style="text-align:center;font-weight:700;color:var(--ink)" id="scanTxt">생김새를 읽고 있어요</p><p class="notice" style="text-align:center">시간 · 구역 · 생김새를 카드에 담는 중</p></div>`);
  wireClose(el);
  const herePromise=getHere();
  let res;try{res=await readPhoto(file)}catch(err){URL.revokeObjectURL(url);closeSheet();toast('사진을 열 수 없어요. 다시 찍어 주세요.');return}
  const d={id:uid(),no:Store.nextNo(),species:hint&&hint.cls?({cat:'cat',dog:'dog',bird:'bird'}[hint.cls]):'cat',coat:guessCoat(res.avg),photo:res.photo,traits:[],
    seen:1,createdAt:Date.now(),lastSeen:Date.now(),known:null,matchScore:null,aiUsed:false};
  // 1) Claude vision when this view may use it (the Claude link)
  let ai=null;
  if(AI.ready()){try{ai=await aiRecognize(res.photo,Store.cards.filter(c=>c.photo).slice(0,4))}catch(e){AI.fail(e)}}
  if(ai){d.aiUsed=true;d.species=ai.species;if(ai.coat)d.coat=ai.coat;d.name=ai.name;d.breed=ai.breed;if(ai.known)d.known=ai.known}
  // 2) the patch engine always: is this someone already in the dex?
  try{
    const Q=await engPrep(res.photo);let best=null;
    for(const c of Store.cards.filter(c=>c.photo&&c.species===d.species)){const s=engPairScore(Q,await engPrep(c.photo)).score;if(!best||s>best.s)best={id:c.id,s}}
    if(hint&&hint.match&&(!best||hint.match.score>best.s))best={id:hint.match.id,s:hint.match.score};
    if(best&&best.s>=ENG.TH.cand){d.suggest=best;if(!d.known&&best.s>=ENG.TH.same)d.known=best.id}
  }catch(e){}
  const here=await herePromise;
  if(here){d.x=here.x;d.y=here.y;d.gps=true}else{const L=LANDMARKS[Math.floor(Math.random()*LANDMARKS.length)];d.x=L.x+Math.random()*80-40;d.y=L.y+Math.random()*80-40}
  d.traits=COATS[d.coat].traits.slice();
  if(!d.name)d.name=COATS[d.coat].names[Math.floor(Math.random()*COATS[d.coat].names.length)];
  if(!d.breed&&d.species==='cat')d.breed=BREED_BY_COAT[d.coat]||'';
  URL.revokeObjectURL(url);
  if(!$('#sheetRoot .sheet'))return;
  const k=d.known&&Store.cards.find(c=>c.id===d.known);
  $('#scanBox').classList.add('done');
  $('#scanBox').insertAdjacentHTML('afterbegin',`<span class="scan-label">${k?`${h(k.name)} 같아요`:`새 친구 · ${SPECIES[d.species]}`}</span>`);
  $('#scanTxt').textContent=k?'도감에 있는 친구와 닮았어요':'새 카드가 준비됐어요';
  await new Promise(r=>setTimeout(r,800));
  if($('#sheetRoot .sheet'))editCard(d);
}

        saved={id:d.id,no:Store.nextNo(),name,species:d.species,breed:d.breed,coat:d.coat,traits:d.traits,photo:d.photo,x:snap(d.x),y:snap(d.y),zone:ZONE,by:Store.me,seen:1,createdAt:d.createdAt,lastSeen:d.lastSeen};
        const lv0=levelInfo().lv;await Store.saveExact(saved.id,d);await Store.add(saved);revealCard(saved,'new');checkLostPosts(saved);setTimeout(()=>{const LV=levelInfo();if(LV.lv>lv0)toast(`레벨 업! Lv.${LV.lv} ${LV.name}`)},700)}
    }catch(err){btn.disabled=false;btn.textContent='카드 저장';toast('저장하지 못했어요. 잠시 후 다시 눌러 주세요.');if(err&&err.code==='not_granted')Store.useLocal()}
  };
}
